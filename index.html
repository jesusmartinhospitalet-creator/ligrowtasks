      </div>
      <div onclick="event.stopPropagation()">
        ${getOwnerBadge(t.owner || 'Jesús')}
      </div>
      <div class="tk-due ${isOverdue?'overdue':''}">${dueFormatted}</div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel tk-prio-sel prio-${prioClass}" onchange="updateTaskField('${p.id}','${t.code}','priority',this.value)">
          ${['Alta','Media','Baja'].map(v=>`<option ${(t.pri||t.priority)===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel tk-status-sel status-${statusSlug}" onchange="updateTaskField('${p.id}','${t.code}','status',this.value)">
          ${['Sin empezar','Trabajando','Esperando feedback','Listo'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div onclick="event.stopPropagation()">
        ${getTaskElementsBadges(t)}
      </div>
    </div>
    <div class="tk-detail ${isOpen?'open':''}">
      <!-- DESCRIPCIÓN -->
      <div class="tk-panel" onclick="event.stopPropagation()">
        <div class="tk-panel-hd">DESCRIPCIÓN</div>
        <textarea class="tk-textarea" placeholder="Explica el objetivo y los detalles de esta tarea." onchange="updateTaskField('${p.id}','${t.code}','description',this.value)">${t.description||''}</textarea>

      </div>
      <!-- CHECKLIST -->
      <div class="tk-panel" onclick="event.stopPropagation()">
        <div class="tk-panel-hd">CHECKLIST</div>
        <div class="tk-chk-items">
          ${cl.map((c,i)=>`
            <div class="tk-chk-row ${c.done?'done':''}" onclick="toggleChkItem('${p.id}','${t.code}',${i})">
              <div class="tk-chk-box ${c.done?'on':''}">${c.done?'✓':''}</div>

        </div>

function docsLibrarySection(p){
  const allDocs = p.docs || []
  
  // Category counts
  const counts = {
    todos: allDocs.length,
    documentos: Math.max(2, allDocs.filter(d => (d.category === 'Documentos') || (d.name && d.name.toLowerCase().endsWith('.pdf'))).length),
    enlaces: Math.max(3, allDocs.filter(d => (d.category === 'Enlaces') || (d.type === 'link')).length),
    imagenes: Math.max(1, allDocs.filter(d => (d.category === 'Imágenes') || (d.platform === 'image')).length),
    figma: Math.max(1, allDocs.filter(d => (d.category === 'Figma') || (d.name && d.name.toLowerCase().includes('figma'))).length),
    carpetas: Math.max(1, allDocs.filter(d => (d.category === 'Carpetas') || (d.name && d.name.toLowerCase().includes('drive'))).length)
  }

  // Filter and search
  let filteredDocs = allDocs
  if(S.docFilter && S.docFilter !== 'Todos'){
    const f = S.docFilter.toLowerCase()
    filteredDocs = filteredDocs.filter(d => {
      const cat = (d.category || '').toLowerCase()
      const name = (d.name || '').toLowerCase()
      if(f.includes('doc')) return cat.includes('doc') || name.endsWith('.pdf')
      if(f.includes('enlace')) return cat.includes('enlace') || (d.type === 'link' && !name.includes('figma') && !name.includes('drive'))
      if(f.includes('imág') || f.includes('imag')) return cat.includes('im') || d.platform === 'image'
      if(f.includes('figma')) return cat.includes('figma') || name.includes('figma')
      if(f.includes('carpeta')) return cat.includes('carpeta') || name.includes('drive')
      return true
    })
  }

  if(S.docSearch && S.docSearch.trim()){
    const q = S.docSearch.toLowerCase().trim()
    filteredDocs = filteredDocs.filter(d => 
      (d.name && d.name.toLowerCase().includes(q)) ||
      (d.desc && d.desc.toLowerCase().includes(q)) ||
      (d.owner && d.owner.toLowerCase().includes(q))
    )
  }

  const filterTabs = [
    { id: 'Todos', label: 'Todos', count: counts.todos, ico: '📁' },
    { id: 'Documentos', label: 'Documentos', count: counts.documentos, ico: '📄' },
    { id: 'Enlaces', label: 'Enlaces', count: counts.enlaces, ico: '🔗' },
    { id: 'Imágenes', label: 'Imágenes', count: counts.imagenes, ico: '🖼️' },
    { id: 'Figma', label: 'Figma', count: counts.figma, ico: '🎨' },
    { id: 'Carpetas', label: 'Carpetas', count: counts.carpetas, ico: '📂' },
  ]

  return `<div class="doc-library-card">
    <div class="doc-lib-header">
      <div>
        <div class="doc-lib-title-row">
          <span class="doc-lib-ico">📁</span>
          <span class="doc-lib-title">Documentos &amp; Recursos</span>
          <span class="doc-lib-badge">${allDocs.length}</span>
        </div>
        <div class="doc-lib-sub">Archivos, enlaces y recursos del cliente. Puedes añadir PDFs, enlaces de Drive, Figma, etc.</div>
      </div>
      <div class="doc-lib-actions">
        <div class="doc-search-box">
          <span style="font-size:12px;opacity:0.6">🔍</span>
          <input id="doc-search-input" value="${escapeHtml(S.docSearch||'')}" oninput="onDocSearch(this.value)" placeholder="Buscar recursos..."/>
        </div>
        <button class="doc-add-btn" onclick="openAddDoc('${p.id}')">+ Añadir recurso</button>
      </div>
    </div>

    <!-- Category Filters & View Mode -->
    <div class="doc-filters-strip">
      <div class="doc-tabs-left">
        ${filterTabs.map(tab => `
          <button class="doc-tab-btn ${S.docFilter===tab.id?'active':''}" onclick="setDocFilter('${tab.id}')">
            <span>${tab.ico}</span>
            <span>${tab.label}</span>
            <span style="opacity:0.8">${tab.count}</span>
          </button>
        `).join('')}
      </div>
      <div class="doc-view-toggle">
        <button class="doc-v-btn ${S.docViewMode==='grid'?'active':''}" onclick="setDocViewMode('grid')" title="Vista cuadrícula">⊞</button>
        <button class="doc-v-btn ${S.docViewMode==='list'?'active':''}" onclick="setDocViewMode('list')" title="Vista lista">☰</button>
      </div>
    </div>

    <!-- Documents List / Grid -->
    <div class="doc-list-container">
      ${filteredDocs.length ? filteredDocs.map((d, i) => {
        const plat = getDocPlatform(d)
        const isPdf = plat.type === 'pdf' || (d.name && d.name.toLowerCase().endsWith('.pdf'))
        const isFigma = plat.id === 'figma' || (d.name && d.name.toLowerCase().includes('figma'))
        const isDrive = plat.id === 'drive' || (d.name && d.name.toLowerCase().includes('drive'))
        const isImage = plat.type === 'image' || plat.id === 'image'
        const isViewable = plat.isPreviewable || isPdf || isImage

        let icoHtml = `<span class="doc-ico-badge pdf">PDF</span>`
        if(isPdf) {
          const initials = d.name.toUpperCase().startsWith('PROPUESTA') ? 'PB' : 'PP'
          icoHtml = `<span class="doc-ico-badge pdf">${initials}</span>`
        } else if(isFigma) {
          icoHtml = `<span class="doc-ico-badge figma" style="font-size:18px">🎨</span>`
        } else if(isDrive) {
          icoHtml = `<span class="doc-ico-badge drive" style="font-size:18px">📁</span>`
        } else if(isImage) {
          icoHtml = `<span class="doc-ico-badge" style="background:#0284C7;color:#fff;font-size:13px">🖼️</span>`
        } else {
          icoHtml = `<span class="doc-ico-badge" style="background:#F3F4F6;color:#374151;font-size:13px">🔗</span>`
        }

        const ownerName = d.owner || p.responsable || 'Jesús'
        const dateStr = d.date || 'Reciente'
        const sizeStr = d.size || '-'

        return `<div class="doc-row-v2">
          ${icoHtml}
          <div class="doc-info-col">

          </div>
          <div class="doc-meta-col">
            ${getOwnerBadge(ownerName)}
            <span class="doc-date-txt">${dateStr}</span>
            <span class="doc-size-txt">${sizeStr}</span>
            ${isViewable ? `
              <button class="doc-btn-online" onclick="openDocViewer('${escapeHtml(d.name)}', '${escapeHtml(d.href||'')}', '${plat.type||'pdf'}', '${escapeHtml(d.desc||'')}')">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>

function resumen(p){

  const recsSection = recordatoriosSection(p)

function kanban(p, isGlobal = false){
  // 1. Recopilar tareas en el ámbito actual vinculadas a su cliente correspondiente
  let allScopeTasks = []
  if(isGlobal || !p){
    isGlobal = true
    DATA.filter(cl => cl.type === 'cliente').forEach(cl => {
      (cl.tasks || []).forEach((t, i) => {
        normTask(t, i, cl)
        allScopeTasks.push({ t, client: cl })
      })
    })
  } else {
    (p.tasks || []).forEach((t, i) => {
      normTask(t, i, p)
      allScopeTasks.push({ t, client: p })
    })
  }

  // 2. Extraer dinámicamente todos los responsables únicos y el recuento de tareas por cada uno
  const ownerCounts = {}
  allScopeTasks.forEach(({ t }) => {
    const owner = (t.owner || '').trim() || 'Sin asignar'
    ownerCounts[owner] = (ownerCounts[owner] || 0) + 1
  })
  const uniqueOwners = Object.keys(ownerCounts).sort((a,b) => a.localeCompare(b))

  // 3. Segmentación: Exactamente 1 solo Kanban visible en pantalla según la pestaña seleccionada
  const activeFilter = S.kanbanOwnerFilter || 'all'
  const displayedTasks = (activeFilter === 'all')
    ? allScopeTasks
    : allScopeTasks.filter(({ t }) => ((t.owner || '').trim() || 'Sin asignar') === activeFilter)

  const columns = [
    { id: 'Sin empezar',        title: 'Sin empezar',        icon: '📋', accent: '#64748B', bgLight: 'rgba(100,116,139,0.1)' },
    { id: 'Trabajando',          title: 'Trabajando',          icon: '⚡', accent: 'var(--brand)', bgLight: 'rgba(240,78,35,0.1)' },
    { id: 'Esperando feedback',  title: 'Esperando feedback',  icon: '⏳', accent: '#D97706', bgLight: 'rgba(217,119,6,0.1)' },
    { id: 'Listo',               title: 'Listo',               icon: '✅', accent: '#16A34A', bgLight: 'rgba(22,163,74,0.1)' }
  ]

  const quickTargetClient = p || S.proj || DATA.find(c => c.type === 'cliente')

  return `<div class="kanban-wrapper">
    <!-- Pestañitas dinámicas de responsables (Segmentación de Kanban en 1 solo tablero) -->
    <div class="k-subtabs-bar">
      <span class="k-subtabs-label">👤 Responsables:</span>
      <button class="k-subtab ${activeFilter === 'all' ? 'active' : ''}" onclick="setKanbanOwnerFilter('all')" title="Ver todas las tareas">
        <span>🌐 Vista Global</span>
        <span class="k-subtab-badge">${allScopeTasks.length}</span>
      </button>
      ${uniqueOwners.map(owner => `
        <button class="k-subtab ${activeFilter === owner ? 'active' : ''}" onclick="setKanbanOwnerFilter('${escapeHtml(owner)}')" title="Filtrar tareas de ${escapeHtml(owner)}">
          <span class="k-subtab-avatar">${escapeHtml(owner.charAt(0).toUpperCase())}</span>
          <span>${escapeHtml(owner)}</span>
          <span class="k-subtab-badge">${ownerCounts[owner]}</span>
        </button>
      `).join('')}
    </div>

    <!-- Tablero Kanban único interactivo -->
    <div class="kanban-board">
      ${columns.map(col => {
        const colItems = displayedTasks.filter(({ t }) => t.status === col.id)
        const isAdding = S._addingCardCol === col.id
        return `<div class="k-col" data-col="${col.id}"
                     ondragover="handleColDragOver(event)" 
                     ondragleave="handleColDragLeave(event)" 
                     ondrop="handleColDrop(event, '${col.id}')">
          <!-- Column Header -->
          <div class="k-col-h">
            <div class="k-col-title-wrap">
              <span class="k-col-icon">${col.icon}</span>
              <span class="k-col-title">${col.title}</span>
              <span class="k-count" style="border-left: 2px solid ${col.accent}">${colItems.length}</span>
            </div>
            <button class="k-col-add-btn" onclick="startQuickCard('${col.id}')" title="Añadir tarjeta a ${col.title}">+</button>
          </div>

          <!-- Cards List -->
          <div class="k-card-list">
            ${colItems.map(({ t, client }) => {
              const cl = t.checklist || t.checklists || []
              const clDone = cl.filter(c => c.done).length
              const isComplete = t.status === 'Listo'
              const linksCount = (t.links?.length || 0) + (t.files?.length || 0)
              const commentsCount = t.comments?.length || 0
              const hasDesc = !!(t.description || t.desc)
              const taskSem = getTaskSemaforo(t)
              const semLabel = taskSem === 'rojo' ? 'Rojo (Urgente)' : taskSem === 'naranja' ? 'Naranja (Atención)' : 'Verde (Normal)'

              return `<div class="k-card ${isComplete?'is-complete':''}" 
                           id="card-${t.code || t.id}"
                           draggable="true" 
                           ondragstart="handleCardDragStart(event, '${client.id}', '${t.code || t.id}')"
                           ondragend="handleCardDragEnd(event)"
                           ondrop="handleCardDrop(event, '${col.id}', '${t.code || t.id}')"
                           onclick="openTaskDetail('${client.id}', '${t.code || t.id}')">
                
                <!-- 1. Banda superior de color estilo Trello (Franja Semáforo de Urgencia) -->
                <div class="k-card-strip sem-${taskSem}" title="Semáforo de urgencia: ${semLabel}">
                  <div class="k-card-strip-left">
                    ${isGlobal ? `<span class="k-card-strip-client" style="border-left:2px solid ${client.color||'#fff'}">${escapeHtml(client.initials || client.name.slice(0,3))}</span>` : ''}
                    <span class="k-card-strip-code">${escapeHtml(t.code || '')}</span>
                    ${t.tag ? `<span class="k-card-strip-tag">${escapeHtml(t.tag)}</span>` : ''}
                  </div>
                  <!-- Selector rápido de semáforo (Verde, Naranja, Rojo) -->
                  <div class="k-card-strip-dots" onclick="event.stopPropagation()">
                    <span class="k-strip-dot dot-v ${taskSem==='verde'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','verde',event)" title="Semáforo: Verde (Normal)"></span>
                    <span class="k-strip-dot dot-n ${taskSem==='naranja'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','naranja',event)" title="Semáforo: Naranja (Atención / En espera)"></span>
                    <span class="k-strip-dot dot-r ${taskSem==='rojo'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','rojo',event)" title="Semáforo: Rojo (Urgente)"></span>
                  </div>
                </div>

                <!-- 2. Cuerpo de la tarjeta: Título, ID / detalles, pequeños iconos -->
                <div class="k-card-body">
                  <!-- Título de la tarea -->
                  <div class="k-card-title">${escapeHtml(t.title || t.name || 'Sin título')}</div>

                  <!-- Descripción previa si existe -->
                  ${hasDesc ? `<div class="k-card-desc-snippet">${escapeHtml(t.description || t.desc)}</div>` : ''}

                  <!-- Fila auxiliar con pequeños iconos estilo Trello -->
                  <div class="k-card-aux-row">
                    <div class="k-card-icons">
                      ${hasDesc ? `<span class="k-aux-ico" title="Tiene descripción">≡</span>` : ''}
                      ${t.due ? `<span class="k-aux-ico ${isComplete?'ico-done':''}" title="Vencimiento: ${escapeHtml(t.due)}">📅 ${fmtDue(t.due)}</span>` : ''}
                      ${cl.length ? `<span class="k-aux-ico ${clDone===cl.length?'ico-done':''}" title="Checklist ${clDone}/${cl.length}">☑ ${clDone}/${cl.length}</span>` : ''}
                      ${linksCount ? `<span class="k-aux-ico" title="${linksCount} adjuntos / enlaces">📎 ${linksCount}</span>` : ''}
                      ${commentsCount ? `<span class="k-aux-ico" title="${commentsCount} comentarios">💬 ${commentsCount}</span>` : ''}
                    </div>

                    <!-- Responsable -->
                    <div class="k-card-owner" title="Responsable: ${escapeHtml(t.owner || 'Sin asignar')}">
                      <div class="k-card-avatar">${((t.owner||'J').trim().charAt(0)||'?').toUpperCase()}</div>
                      <span class="k-card-owner-name">${escapeHtml(t.owner || 'Jesús')}</span>
                    </div>
                  </div>
                </div>
              </div>`
            }).join('')}
            ${!colItems.length && !isAdding ? `<div class="k-empty-col">Arrastra tarjetas aquí</div>` : ''}
          </div>

          <!-- Bottom: Add card trigger or inline box -->
          ${isAdding ? `
            <div class="k-add-card-box">
              <textarea id="k-add-input-${col.id}" class="k-add-textarea" placeholder="Escribe un título para esta tarjeta..." 
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitQuickCard('${quickTargetClient?.id||''}','${col.id}')}"></textarea>
              <div class="k-add-actions">
                <button class="k-add-confirm-btn" onclick="submitQuickCard('${quickTargetClient?.id||''}','${col.id}')">Añadir tarjeta</button>
                <button class="k-add-cancel-btn" onclick="cancelQuickCard()">✕</button>
              </div>
            </div>
          ` : `
            <button class="k-add-card-trigger" onclick="startQuickCard('${col.id}')">
              <span>+ Añadir una tarjeta</span>
            </button>
          `}
        </div>`
      }).join('')}
    </div>
  </div>`
}

function tabla(p){
  const t=p.tasks||[]
  const chipOf=s=>s==='Trabajando'?'chip chip-working':s==='Esperando feedback'?'chip chip-waiting':s==='Listo'?'chip chip-ready':'chip chip-slate'
  return `<table class="gtable">
    <thead><tr>
      <th>Código</th><th>Tarea</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Vence</th>
    </tr></thead>
    <tbody>${t.map(x=>`<tr>
      <td class="tc">${x.code}</td>
      <td style="font-weight:500">${x.name}</td>
      <td>${x.owner}</td>
      <td><span class="${chipOf(x.status)}">${x.status}</span></td>
      <td><span class="pri ${x.priority.toLowerCase()}">${x.priority}</span></td>
      <td style="color:var(--text-3);font-variant-numeric:tabular-nums">${x.due}</td>
    </tr>`).join('')}</tbody>
  </table>`
}

const ORDERS_STORAGE_KEY = 'ligrow_supplier_orders_v1';

function persistSupplierOrdersLocally(orders) {
  if (!Array.isArray(orders)) return;
  try {
    const sanitized = orders.map(o => {
      const copy = { ...o };
      if (Array.isArray(copy.files)) {
        copy.files = copy.files.map(f => {
          if (f.data && typeof f.data === 'string' && f.data.length > 500000) {
            return { ...f, data: f.data.slice(0, 100) + '...truncated' };
          }
          return f;
        });
      }
      return copy;
    });
    localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(sanitized));
  } catch (err) {
    try {
      const lean = orders.map(o => ({
        ...o,
        files: (o.files || []).map(f => ({ id: f.id, name: f.name, type: f.type, size: f.size }))
      }));
      localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(lean));
    } catch (e2) {}
  }
}

function loadSupplierOrdersLocally() {
  try {
    const raw = localStorage.getItem(ORDERS_STORAGE_KEY);
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return null;
}

function formatFileSize(bytes) {
  if (!bytes || isNaN(bytes)) return '0 KB';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + (sizes[i] || 'KB');
}

function formatOrderDate(dateStr) {
  if (!dateStr) return '';
  try {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      const d = new Date(year, month, day);
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch (e) {
    return dateStr;
  }
}

function getFileRenderUrl(order, file) {
  if (file?.data && typeof file.data === 'string' && file.data.startsWith('data:')) {
    return file.data;
  }
  if (file?.url && typeof file.url === 'string' && (file.url.startsWith('http') || file.url.startsWith('data:'))) {
    return file.url;
  }
  const isPdf = file?.type === 'application/pdf' || (file?.name && file.name.toLowerCase().endsWith('.pdf'));
  if (isPdf) {
    return getSamplePdfDataUrl(order, file);
  }
  return getSampleImageDataUrl(order, file);
}

function pedidosContent(p) {
  const esc = escapeHtml;
  const orders = Array.isArray(p.orders) ? p.orders : [];

  // 1. KPI Calculations
  let totalGasto = 0;
  let pagadosCount = 0;
  let pagadosSum = 0;
  let pendientesCount = 0;
  let pendientesSum = 0;

  orders.forEach(o => {
    const amt = Number(o.totalAmount || 0);
    totalGasto += amt;
    const st = String(o.status || '').toLowerCase();
    if (st.includes('pagad') || st.includes('recibid') || st.includes('entregad')) {
      pagadosCount++;
      pagadosSum += amt;
    } else {
      pendientesCount++;
      pendientesSum += amt;
    }
  });

  // 2. Filters
  const search = String(S.pedidosSearch || '').toLowerCase().trim();
  const filterSupplier = S.pedidosFilterSupplier || '';
  const filterStatus = S.pedidosFilterStatus || '';
  const sortMode = S.pedidosSort || 'recientes';

  let filteredOrders = orders.filter(o => {
    if (search) {
      const matchSearch = String(o.concept || '').toLowerCase().includes(search) ||
        String(o.supplierName || '').toLowerCase().includes(search) ||
        String(o.invoiceNumber || '').toLowerCase().includes(search) ||
        String(o.notes || '').toLowerCase().includes(search);
      if (!matchSearch) return false;
    }
    if (filterSupplier && o.supplierName !== filterSupplier && o.supplierId !== filterSupplier) {
      return false;
    }
    if (filterStatus && o.status !== filterStatus) {
      return false;
    }
    return true;
  });

  // Sorting
  filteredOrders.sort((a, b) => {
    if (sortMode === 'antiguos') return (a.orderDate || '').localeCompare(b.orderDate || '');
    if (sortMode === 'mayor_importe') return Number(b.totalAmount || 0) - Number(a.totalAmount || 0);
    if (sortMode === 'menor_importe') return Number(a.totalAmount || 0) - Number(b.totalAmount || 0);
    return (b.orderDate || '').localeCompare(a.orderDate || ''); // 'recientes'
  });

  // Providers list for filter dropdown
  const allSuppliers = [];
  (p.cats || []).forEach(cat => {
    (cat.provs || []).forEach(pr => {
      if (!allSuppliers.includes(pr.name)) allSuppliers.push(pr.name);
    });
  });
  orders.forEach(o => {
    if (o.supplierName && !allSuppliers.includes(o.supplierName)) allSuppliers.push(o.supplierName);
  });

  // Render Order Cards
  const cardsHtml = filteredOrders.length ? filteredOrders.map((order, orderIdx) => {
    const files = Array.isArray(order.files) ? order.files : [];

    const dateFormatted = formatOrderDate(order.orderDate);

    const filesPreviewHtml = files.length ? files.map((file, fileIdx) => {
      const isPdf = file.type === 'application/pdf' || (file.name && file.name.toLowerCase().endsWith('.pdf'));
      const renderUrl = getFileRenderUrl(order, file);
      if (isPdf) {
        return `<div class="order-file-chip" onclick="openOrderGallery('${order.id}', ${fileIdx})" title="Ver documento PDF en galería">

// ── CRUD HANDLERS FOR ORDERS ────────────────────────────────────────────────

function openNewOrder() {
  const p = DATA.find(item => item.type === 'proveedor');
  const defaultSupplier = p?.cats?.[0]?.provs?.[0]?.name || 'PrintOnDemand BCN';
  const defaultCat = p?.cats?.[0]?.name || 'Impresión';

  S.modal = 'orderModal';
  S._orderDraft = {
    id: '',
    supplierName: defaultSupplier,
    categoryName: defaultCat,
    concept: '',
    orderDate: new Date().toISOString().slice(0, 10),
    totalAmount: '',
    status: 'Pagado',
    invoiceNumber: '',
    notes: '',
    files: []
  };
  render();
}

function openEditOrder(orderId) {
  const p = DATA.find(item => item.type === 'proveedor');
  const order = (p?.orders || []).find(o => o.id === orderId);
  if (!order) return;

  S.modal = 'orderModal';
  S._orderDraft = JSON.parse(JSON.stringify(order));
  if (!Array.isArray(S._orderDraft.files)) S._orderDraft.files = [];
  render();
}

function cancelOrderModal() {
  S.modal = null;
  S._orderDraft = null;
  render();
}

function handleOrderFilesSelect(filesList) {
  if (!filesList || !filesList.length) return;
  if (!S._orderDraft) return;
  if (!Array.isArray(S._orderDraft.files)) S._orderDraft.files = [];

  Array.from(filesList).forEach(file => {
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const reader = new FileReader();
    reader.onload = (e) => {
      S._orderDraft.files.push({
        id: 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        name: file.name,
        type: file.type || (isPdf ? 'application/pdf' : 'image/jpeg'),
        size: file.size,
        data: e.target.result,
        createdAt: new Date().toISOString()
      });
      render();
    };
    reader.readAsDataURL(file);
  });
}

function removeDraftFile(fileId) {
  if (S._orderDraft && Array.isArray(S._orderDraft.files)) {
    S._orderDraft.files = S._orderDraft.files.filter(f => f.id !== fileId);
    render();
  }
}

async function quickAttachFileToOrder(orderId, fileInput) {
  if (!fileInput || !fileInput.files || !fileInput.files.length) return;
  const p = DATA.find(item => item.type === 'proveedor');
  const order = (p?.orders || []).find(o => o.id === orderId);
  if (!order) return;
  if (!Array.isArray(order.files)) order.files = [];

  const filesToAdd = Array.from(fileInput.files);
  for (const file of filesToAdd) {
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = (e) => {
        order.files.push({
          id: 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          name: file.name,
          type: file.type || (isPdf ? 'application/pdf' : 'image/jpeg'),
          size: file.size,
          data: e.target.result,
          createdAt: new Date().toISOString()
        });
        resolve();
      };
      reader.readAsDataURL(file);
    });
  }

  persistSupplierOrdersLocally(p.orders);
  save({ action: 'Archivos adjuntos', summary: `Se añadieron ${filesToAdd.length} archivo(s) al pedido: ${order.concept}` });
  render();

  // Background Supabase Sync
  if (window.location.protocol !== 'file:') {
    try {
      await fetch('/api/suppliers/orders/' + encodeURIComponent(order.id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(order)
      });
    } catch (e) {
      console.warn('Sync error on quickAttach:', e);
    }
  }
}

async function submitOrderDraft() {
  const draft = S._orderDraft;
  if (!draft) return;

  const concept = (document.getElementById('ord-concept')?.value || draft.concept || '').trim();
  if (!concept) {
    alert('Por favor indica el concepto o descripción del pedido.');
    document.getElementById('ord-concept')?.focus();
    return;
  }

  const supplierName = (document.getElementById('ord-supplier')?.value || draft.supplierName || '').trim();
  if (!supplierName) {
    alert('Por favor indica el proveedor.');
    return;
  }

  const orderDate = document.getElementById('ord-date')?.value || draft.orderDate || new Date().toISOString().slice(0, 10);
  const totalAmount = parseFloat(document.getElementById('ord-amount')?.value || draft.totalAmount || 0) || 0;
  const status = document.getElementById('ord-status')?.value || draft.status || 'Pagado';
  const invoiceNumber = (document.getElementById('ord-invoice')?.value || draft.invoiceNumber || '').trim();
  const notes = (document.getElementById('ord-notes')?.value || draft.notes || '').trim();
  const categoryName = draft.categoryName || '';

  const p = DATA.find(item => item.type === 'proveedor');
  if (!p) return;
  if (!Array.isArray(p.orders)) p.orders = [];

  const isEdit = Boolean(draft.id);
  const orderRecord = {
    id: draft.id || ('ord_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)),
    supplierId: draft.supplierId || null,
    supplierName,
    categoryName,
    concept,
    orderDate,
    totalAmount,
    status,
    invoiceNumber,
    notes,
    files: Array.isArray(draft.files) ? draft.files : [],
    updatedAt: new Date().toISOString()
  };

  if (isEdit) {
    const idx = p.orders.findIndex(o => o.id === draft.id);
    if (idx !== -1) p.orders[idx] = orderRecord;
    else p.orders.unshift(orderRecord);
  } else {
    orderRecord.createdAt = new Date().toISOString();
    p.orders.unshift(orderRecord);
  }

  S.modal = null;
  S._orderDraft = null;

  persistSupplierOrdersLocally(p.orders);
  save({ action: isEdit ? 'Pedido actualizado' : 'Nuevo pedido', summary: `${isEdit ? 'Actualizado' : 'Registrado'} pedido a ${orderRecord.supplierName}: ${orderRecord.concept}` });
  render();

  // Cloud & Supabase synchronization
  if (window.location.protocol !== 'file:') {
    try {
      const url = isEdit ? '/api/suppliers/orders/' + encodeURIComponent(orderRecord.id) : '/api/suppliers/orders';
      const method = isEdit ? 'PUT' : 'POST';
      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(orderRecord)
      });
    } catch (err) {
      console.warn('Error synchronizing order with Supabase:', err);
    }
  }
}

async function deleteOrder(orderId, event) {
  event?.preventDefault();
  event?.stopPropagation();

  const p = DATA.find(item => item.type === 'proveedor');
  if (!p || !Array.isArray(p.orders)) return;

  const order = p.orders.find(o => o.id === orderId);
  if (!order) return;

  if (!confirm(`¿Eliminar el pedido "${order.concept}" de ${order.supplierName} por valor de € ${Number(order.totalAmount || 0).toFixed(2)}? Esta acción no se puede deshacer.`)) {
    return;
  }

  p.orders = p.orders.filter(o => o.id !== orderId);
  persistSupplierOrdersLocally(p.orders);
  save({ action: 'Pedido eliminado', summary: `Eliminado pedido de ${order.supplierName}: ${order.concept}` });
  render();

  if (window.location.protocol !== 'file:') {
    try {
      await fetch('/api/suppliers/orders/' + encodeURIComponent(orderId), {
        method: 'DELETE',
        credentials: 'same-origin'
      });
    } catch (e) {
      console.warn('Error deleting order from Supabase:', e);
    }
  }
}

function openOrderGallery(orderId, initialFileIndex = 0) {
  const p = DATA.find(item => item.type === 'proveedor');
  const order = (p?.orders || []).find(o => o.id === orderId);
  if (!order || !order.files || !order.files.length) return;

  S.modal = 'orderGallery';
  S._gallery = {
    orderId,
    fileIndex: Math.max(0, Math.min(initialFileIndex || 0, order.files.length - 1)),
    zoom: 1
  };
  render();
}

function galleryPrevFile() {
  if (!S._gallery) return;
  const p = DATA.find(item => item.type === 'proveedor');
  const order = (p?.orders || []).find(o => o.id === S._gallery.orderId);
  if (!order || !order.files || !order.files.length) return;

  const total = order.files.length;
  S._gallery.fileIndex = (S._gallery.fileIndex - 1 + total) % total;
  S._gallery.zoom = 1;
  render();
}

function galleryNextFile() {
  if (!S._gallery) return;
  const p = DATA.find(item => item.type === 'proveedor');
  const order = (p?.orders || []).find(o => o.id === S._gallery.orderId);
  if (!order || !order.files || !order.files.length) return;

  const total = order.files.length;
  S._gallery.fileIndex = (S._gallery.fileIndex + 1) % total;
  S._gallery.zoom = 1;
  render();
}

function galleryZoom(delta) {
  if (!S._gallery) return;
  S._gallery.zoom = Math.max(0.5, Math.min(3, (S._gallery.zoom || 1) + delta));
  render();
}

function galleryResetZoom() {
  if (!S._gallery) return;
  S._gallery.zoom = 1;
  render();
}

      <div class="ogallery-tools">

          <button type="button" class="ogallery-tool-btn" onclick="galleryZoom(-0.2)" title="Reducir zoom">🔍 −</button>

// Sincronización de pedidos desde el backend / Supabase
async function loadSupplierOrders() {
  const p = DATA.find(item => item.type === 'proveedor');
  if (!p) return;
  if (window.location.protocol === 'file:') return;
  try {
    const res = await fetch('/api/suppliers/orders', { credentials: 'same-origin' });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.orders)) {
        p.orders = data.orders;
        persistSupplierOrdersLocally(p.orders);
        save();
        render();
      }
    }
  } catch (e) {
    console.warn('Sync orders warning:', e.message);
  }
}

  const clientes = DATA.filter(p=>p.type==='cliente')
  const allTasks = clientes.flatMap(p=>(p.tasks||[]).map(t=>({...t,clientName:p.name,clientColor:p.color})))
  const sinEmpezar = allTasks.filter(t=>t.status==='Sin empezar')
  const trabajando  = allTasks.filter(t=>t.status==='Trabajando')
  const esperandoFeedback = allTasks.filter(t=>t.status==='Esperando feedback')
  const listo    = allTasks.filter(t=>t.status==='Listo')
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Dashboard</div>
          <div class="proj-sub-text">Vista general · ${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
      </div>
    </div>
    <div class="ct">
      <div class="stats" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat"><div class="stat-lbl">Clientes activos</div><div class="stat-val">${clientes.length}</div></div>
        <div class="stat"><div class="stat-lbl">Sin empezar</div><div class="stat-val">${sinEmpezar.length}</div></div>
        <div class="stat"><div class="stat-lbl">⚡ Trabajando</div><div class="stat-val accent">${trabajando.length}</div></div>
        <div class="stat" style="${esperandoFeedback.length>0?'border-color:rgba(217,119,6,0.4);background:#FFFDF7':''}"><div class="stat-lbl" style="${esperandoFeedback.length>0?'color:#B45309;font-weight:700':''}">⏳ Esperando cliente</div><div class="stat-val" style="${esperandoFeedback.length>0?'color:#D97706;font-weight:800':''}">${esperandoFeedback.length}</div></div>
        <div class="stat"><div class="stat-lbl">✅ Completadas</div><div class="stat-val green">${listo.length}</div></div>
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px">Tareas activas por cliente</div>
      ${clientes.map(p=>{
        const t=p.tasks||[]
        const tr=t.filter(x=>x.status==='Trabajando')
        const esp=t.filter(x=>x.status==='Esperando feedback')
        if(!t.length)return''
        return `<div class="card" style="margin-bottom:12px;padding:14px 18px;cursor:pointer" onclick="selectProj('${p.id}')">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:26px;height:26px;border-radius:6px;background:${p.color};display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;color:#fff">${p.initials}</div>
            <div style="font-weight:700;font-size:14px;color:var(--text-1)">${p.name}</div>
            <span style="margin-left:auto;font-size:11px;color:var(--text-3)">${p.sub}</span>
            ${tr.length?`<span class="chip chip-working" style="margin-left:8px">${tr.length} trabajando</span>`:''}
            ${esp.length?`<span class="chip chip-waiting" style="margin-left:8px">${esp.length} esperando cliente</span>`:''}
          </div>
          ${tr.slice(0,3).map(x=>`<div class="t-row">
            <div class="t-dot" style="background:${(x.pri||x.priority)==='Alta'?'#D63A0F':(x.pri||x.priority)==='Media'?'#D48000':'#0F9460'}"></div>
            <div class="t-name">${escapeHtml(x.title||x.name||'Tarea')}</div>
            <div class="t-owner">${escapeHtml(x.tag||x.owner||'')}</div>
            <span style="font-size:11px;color:var(--text-3)">${x.due||''}</span>
          </div>`).join('')}
          ${tr.length>3?`<div style="font-size:11px;color:var(--text-3);padding:6px 0">+${tr.length-3} más...</div>`:''}
        </div>`
      }).join('')}
    </div>
  </div>`
}

// ─ NAV: Proyectos ─────────────────────────────────────────────────────────────
function navProyectos(){
  const typeLabel={cliente:'Cliente',app:'App',proveedor:'Proveedor'}
  const groups=[
    {label:'Clientes', items:DATA.filter(p=>p.type==='cliente')},
    {label:'Apps',     items:DATA.filter(p=>p.type==='app')},
    {label:'Proveedores', items:DATA.filter(p=>p.type==='proveedor')},
  ]
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Todos los proyectos</div>
          <div class="proj-sub-text">${DATA.length} proyectos · ${DATA.filter(p=>p.type==='cliente').length} clientes · ${DATA.filter(p=>p.type==='app').length} apps</div>
        </div>
        <button class="tb-action" style="background:var(--brand)">+ Nuevo proyecto</button>
      </div>
    </div>
    <div class="ct">
      ${groups.map(g=>`
        <div style="margin-bottom:24px">
          <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px">${g.label}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
            ${g.items.map(p=>{
              const a=ACCENT[p.type]
              const t=p.tasks||[]
              const en=t.filter(x=>x.status==='En curso').length
              return `<div class="card" style="padding:14px 16px;cursor:pointer;transition:box-shadow .15s" onclick="selectProj('${p.id}')">
                <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
                  <div style="width:32px;height:32px;border-radius:${p.type==='app'?'50%':'8px'};background:${p.color};display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">${p.initials}</div>
                  <div>
                    <div style="font-weight:700;font-size:13px;color:var(--text-1)">${p.name}</div>
                    <span style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:${a.light};color:${a.text}">${typeLabel[p.type]}</span>
                  </div>
                </div>
                <div style="font-size:11.5px;color:var(--text-3);line-height:1.4">${p.sub}</div>
                ${t.length?`<div style="margin-top:10px;font-size:11px;color:var(--text-3)"><span style="color:var(--brand);font-weight:700">${en}</span> en curso · ${t.length} total</div>`:''}
              </div>`
            }).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`
}

// ─ NAV: Calendario ────────────────────────────────────────────────────────────
function navCalendario(){
  const allTasks = DATA.filter(p=>p.type==='cliente')
    .flatMap(p=>(p.tasks||[]).filter(t=>t.due).map(t=>({...t,clientName:p.name,clientColor:p.color})))
    .sort((a,b)=>a.due.localeCompare(b.due))
  const byDate={}
  allTasks.forEach(t=>{if(!byDate[t.due])byDate[t.due]=[];byDate[t.due].push(t)})
  const formatDate=d=>{const[y,m,day]=d.split('-');const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return`${parseInt(day)} ${months[parseInt(m)-1]}`}
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Calendario</div>
          <div class="proj-sub-text">Tareas ordenadas por fecha de vencimiento</div>
        </div>
      </div>
    </div>
    <div class="ct">
      ${Object.entries(byDate).map(([date,tasks])=>`
        <div style="display:flex;gap:16px;margin-bottom:16px;align-items:flex-start">
          <div style="width:52px;text-align:center;flex-shrink:0;padding-top:2px">
            <div style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px;color:var(--text-1);line-height:1">${formatDate(date).split(' ')[0]}</div>
            <div style="font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3)">${formatDate(date).split(' ')[1]}</div>
          </div>
          <div style="flex:1;border-left:2px solid var(--border-2);padding-left:16px">
            ${tasks.map(t=>`<div class="card" style="padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px">
              <div style="width:8px;height:8px;border-radius:50%;background:${t.clientColor};flex-shrink:0"></div>
              <div style="flex:1">
                <div style="font-size:13px;font-weight:500;color:var(--text-1)">${t.name}</div>
                <div style="font-size:11px;color:var(--text-3);margin-top:1px">${t.clientName} · ${t.owner}</div>
              </div>
              <span class="pri ${t.priority.toLowerCase()}">${t.priority}</span>
              <span class="chip ${t.status==='En curso'?'chip-orange':t.status==='Listo'?'chip-green':'chip-red'}">${t.status}</span>
            </div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`
}

// ── Restore persisted state ───────────────────────────────────────────────────
const STORE_VERSION='v15'
if(localStorage.getItem('ligrow_ver')!==STORE_VERSION){
  localStorage.removeItem('ligrow_data')
  localStorage.removeItem('ligrow_state')
  localStorage.setItem('ligrow_ver',STORE_VERSION)
}
try{
  const savedData=JSON.parse(localStorage.getItem('ligrow_data')||'null')
  if(Array.isArray(savedData) && savedData.length) DATA=savedData
}catch(e){}

// Purga de tareas de prueba y normalización de tareas cargadas
DATA.forEach(p=>{
  if(p.type==='cliente'){
    if(p.tasks){
      p.tasks = p.tasks.filter(t => t.name?.toLowerCase() !== 'prueba' && t.title?.toLowerCase() !== 'prueba' && t.code !== 'CPB-05')
      p.tasks = p.tasks.map((t,idx)=>normTask(t, idx, p))
    }
    if(!p.lastModifiedBy) p.lastModifiedBy = 'Jesús';
    if(!p.lastModifiedAt) p.lastModifiedAt = '2026-10-03T19:25:00.000Z';
    p.ultimaActividad = formatLastActivity(p.lastModifiedBy, p.lastModifiedAt);
  }
  if(p.type==='proveedor'){
    const localOrders = typeof loadSupplierOrdersLocally === 'function' ? loadSupplierOrdersLocally() : null;
    if(localOrders !== null){
      p.orders = localOrders;
    } else if(!Array.isArray(p.orders)){
      p.orders = [];
    }
  }
})

// ── Session & User Access Restoration ─────────────────────────────────────────
try{
  const savedUser = JSON.parse(localStorage.getItem('ligrow_auth_user') || 'null');
  if(savedUser && savedUser.email){
    S.currentUser = savedUser;
    if(savedUser.role === 'admin'){
      S.defaultUser = 'Jesús';
    } else {
      S.defaultUser = savedUser.name || 'Blanca';
      const allowed = Array.isArray(savedUser.allowedClients) ? savedUser.allowedClients : ['cpb'];
      const targetProj = DATA.find(p => allowed.includes(p.id)) || DATA.find(p => p.id === 'cpb') || DATA[0];
      if(targetProj) S.proj = targetProj;
      S.navView = null;
    }
  }
}catch(e){}

// Verify session in background with API
fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(res => {
    if(res && res.user){
      S.currentUser = res.user;
      localStorage.setItem('ligrow_auth_user', JSON.stringify(res.user));
      render();
    }
  })
  .catch(()=>{});

try{
  const savedTheme=localStorage.getItem('ligrow_theme')
  if(savedTheme && ['light','dark','auto'].includes(savedTheme)) S.theme=savedTheme
  else S.theme='light'
}catch(e){ S.theme='light' }
try{
  const st=JSON.parse(localStorage.getItem('ligrow_state')||'{}')
  if(st.filter&&['todos','clientes','apps','proveedores'].includes(st.filter))S.filter=st.filter
  if(st.projId){const found=DATA.find(x=>x.id===st.projId && canAccessClient(x.id));if(found)S.proj=found}
  if(st.view)S.view=st.view
  if(st.navView!==undefined && S.currentUser?.role === 'admin')S.navView=st.navView
  if(st.theme)S.theme=st.theme
  if(st.defaultUser)S.defaultUser=st.defaultUser
  if(st.kanbanOwnerFilter)S.kanbanOwnerFilter=st.kanbanOwnerFilter
}catch(e){}
try{
  const urlParams = new URLSearchParams(window.location.search)
  if(urlParams.get('proj')){
    const pFound = DATA.find(x => x.id === urlParams.get('proj') && canAccessClient(x.id))
    if(pFound) S.proj = pFound
  }
  if(urlParams.get('view')) S.view = urlParams.get('view')
  if(urlParams.get('navView') && S.currentUser?.role === 'admin') S.navView = urlParams.get('navView')
  if(urlParams.get('owner')) S.kanbanOwnerFilter = urlParams.get('owner')
  if(urlParams.get('theme')) S.theme = urlParams.get('theme')
  if(urlParams.get('task')){
    S.modal = 'taskDetail'
    S._taskDetail = { clientId: S.proj?.id || 'cpb', taskCode: urlParams.get('task') }
  }
  if(urlParams.get('modal')){
    S.modal = urlParams.get('modal')
    if(S.modal === 'addDoc') S._docPid = S.proj?.id || 'cpb'
    if(S.modal === 'docViewer'){
      S._docViewer = {
        title: urlParams.get('docTitle') || 'Propuesta Rediseño Web CPB.pdf',
        url: urlParams.get('docUrl') || '#',
        type: urlParams.get('docType') || 'pdf',
        desc: urlParams.get('docDesc') || 'Presentación completa de concepto visual, colores y wireframes'
      }
    }
  }
}catch(e){}

// Guard against a stale or unauthorized S.proj reference
if(!S.proj || !canAccessClient(S.proj.id)){
  const allowed = filtered()
  S.proj = allowed[0] || DATA[0] || null
}

// Atajo de teclado: Escape cierra cualquier modal, flechas para navegar en la galería
window.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.modal) closeModal()
  if(S.modal==='orderGallery'){
    if(e.key==='ArrowLeft') galleryPrevFile()
    if(e.key==='ArrowRight') galleryNextFile()
  }
})

// Initialize theme (default: warm light)
applyTheme(S.theme)
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(S.theme==='auto') applyTheme('auto')
  })
}

// Start with brand orange
applyAccent('cliente')
render()

// Sincronizar espacio del proyecto activo si hay usuario
if(S.currentUser && S.proj?.id){
  syncLoadCurrentProject(S.proj.id);
}

// Sincronización en segundo plano periódica (cada 25 segundos)
setInterval(() => {
  if(S.currentUser && S.proj && S.proj.id && (S.proj.type === 'cliente' || S.proj.id === 'pv') && !S.modal){
    syncLoadCurrentProject(S.proj.id);
  }
}, 25000);

loadSupplierDirectory().catch(()=>{})
loadSupplierOrders().catch(()=>{})
</script>
</body>
</html>
