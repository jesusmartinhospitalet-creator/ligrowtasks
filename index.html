      <!-- Top Urgency Stripe -->

            onchange="updateTaskField('${p.id}','${t.code}','title',this.value);updateTaskField('${p.id}','${t.code}','name',this.value)"/>

            en la lista 
            <select class="trello-list-select" onchange="updateTaskField('${p.id}','${t.code}','status',this.value)">

                <option value="${st}" ${t.status===st?'selected':''}>${st}</option>

      </div>

      <!-- Modal Body Grid (Left: Main Content, Right: Actions) -->
      <div class="trello-modal-grid">
        <div class="trello-main-col">
          <!-- Metadata strip -->
          <div class="trello-meta-strip">
            <div class="trello-meta-box">
              <span class="trello-meta-label">MIEMBRO</span>
              <div class="trello-member-badge">
                <div class="trello-avatar">${(t.owner||'J').charAt(0).toUpperCase()}</div>
                <input class="trello-meta-input" value="${escapeHtml(t.owner||'Jesús')}" 
                  onchange="updateTaskField('${p.id}','${t.code}','owner',this.value)" style="width:90px"/>

              </select>
            </div>

            <div class="trello-meta-box">
              <span class="trello-meta-label">ETIQUETA</span>

            <div class="trello-comments-stream">
              ${comments.length ? comments.slice().reverse().map(cm=>`
                <div class="trello-comment-item">
                  <div class="trello-avatar sm">${(cm.author||'J').charAt(0).toUpperCase()}</div>
                  <div class="trello-comment-content">
                    <div class="trello-comment-meta">
                      <strong>${escapeHtml(cm.author||'Jesús')}</strong>
                      <span class="trello-comment-time">${escapeHtml(cm.date||'Hoy')}</span>

function necesitaAtencionSection(p){
  const items = getAttentionItems(p)
  if(!items.length){
    return `<div class="attention-card all-good" style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="att-ico-box good">✓</div>
        <div style="flex:1">
          <div style="font-size:13.5px;font-weight:700;color:#16A34A;display:flex;align-items:center;gap:6px">
            <span>Todo al día</span>
            <span style="font-size:11px;font-weight:600;color:var(--text-3);background:var(--surface-2);padding:2px 8px;border-radius:10px">0 incidencias activas</span>
          </div>
          <div style="font-size:11.5px;color:var(--text-3);margin-top:2px">No hay tareas vencidas, feedback pendiente de cliente ni recordatorios críticos sin atender.</div>
        </div>
      </div>
    </div>`
  }

  return `<div class="attention-card has-issues" style="margin-bottom:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="att-ico-box warn">⚠️</div>
        <div>
          <div style="font-size:14px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:8px">
            <span>Necesita atención</span>
            <span class="att-count-badge">${items.length} asunto${items.length>1?'s':''}</span>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:1px">Elementos críticos que requieren acción o seguimiento inmediato con el cliente o equipo.</div>
        </div>
      </div>
    </div>
    <div class="att-items-grid">
      ${items.map(it => {
        if(it.task){
          const t = it.task
          return `<div class="att-item-row" onclick="openTaskDetail('${p.id}','${t.code||t.id}')">
            <span class="att-badge ${it.cls}">${it.badge}</span>
            <div class="att-item-content">
              <div class="att-item-title">${escapeHtml(t.title||t.name||'Tarea')} <span style="font-size:11px;font-weight:500;color:var(--text-3)">(${t.code||''})</span></div>
              <div class="att-item-msg">${escapeHtml(it.msg)}</div>
            </div>
            <div class="att-item-meta">
              <span class="att-owner-pill">👤 ${escapeHtml(t.owner||'Sin asignar')}</span>
              <button class="att-act-btn" onclick="event.stopPropagation();openTaskDetail('${p.id}','${t.code||t.id}')">Abrir ↗</button>
            </div>
          </div>`
        } else if(it.rec){
          const r = it.rec
          return `<div class="att-item-row" onclick="startAddRec()">
            <span class="att-badge ${it.cls}">${it.badge}</span>
            <div class="att-item-content">
              <div class="att-item-title">${escapeHtml(r.text||'Recordatorio')}</div>
              <div class="att-item-msg">${escapeHtml(it.msg)}</div>
            </div>
            <div class="att-item-meta">
              <button class="att-act-btn">Revisar ↗</button>
            </div>
          </div>`
        }
        return ''
      }).join('')}

  </div>`

function resumen(p){
  const tasks=p.tasks||[]
  const recs=p.recordatorios||[]
  const docs=p.docs||[]
  const pendingTasks=tasks.filter(x=>x.status!=='Listo').length
  const workingTasks=tasks.filter(x=>x.status==='Trabajando').length
  const waitingClient=tasks.filter(x=>x.status==='Esperando feedback').length
  const doneTasks=tasks.filter(x=>x.status==='Listo').length

  // 1. Bloque superior diferenciador "Necesita atención"
  const attentionBlock = necesitaAtencionSection(p)

  // 2. Barra de métricas con "Esperando cliente" como KPI clave
  const statsBar=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px">
    <div class="stat">
      <div class="stat-lbl">Tareas pendientes</div>
      <div class="stat-val ${pendingTasks>0?'accent':'green'}">${pendingTasks}</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">⚡ Trabajando</div>
      <div class="stat-val" style="color:var(--brand)">${workingTasks}</div>
    </div>
    <div class="stat" style="${waitingClient>0?'border-color:rgba(217,119,6,0.4);background:#FFFDF7':''}">
      <div class="stat-lbl" style="${waitingClient>0?'color:#B45309;font-weight:700':''}">⏳ Esperando cliente</div>
      <div class="stat-val" style="${waitingClient>0?'color:#D97706;font-weight:800':''}">${waitingClient}</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">✅ Completadas</div>
      <div class="stat-val green">${doneTasks}</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">📁 Biblioteca &amp; Docs</div>
      <div class="stat-val">${docs.length}</div>
    </div>
  </div>`

  // 3. Biblioteca Documentos & Recursos con identificación visual por plataforma y visor online
  const docsSection=`<div class="card" style="display:flex;flex-direction:column;gap:0">
    <div class="doc-card-header">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-1)">
        <span style="font-size:16px">📚</span> Documentos &amp; Recursos
        <span style="font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--surface-2);color:var(--text-3)">${docs.length}</span>
      </div>
      <button onclick="openAddDoc('${p.id}')" style="padding:5px 12px;border-radius:7px;border:none;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer">+ Añadir recurso</button>
    </div>

    ${docs.length?`
      <div style="display:flex;flex-direction:column;gap:0">
        ${docs.map((d,i)=>{
          const plat = getDocPlatform(d)
          const isViewable = plat.isPreviewable || plat.type === 'pdf' || plat.type === 'image' || (d.name && d.name.toLowerCase().endsWith('.pdf'))
          return `<div class="doc-item-row">
            <span class="doc-platform-badge" style="background:${plat.bg};color:${plat.color};border:1px solid ${plat.color}33" title="Plataforma: ${plat.name}">
              <span>${plat.ico}</span>
              <span>${plat.name}</span>
            </span>
            <div class="doc-info-wrap">
              <div class="doc-title-text" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</div>
              ${d.desc?`<div class="doc-sub-text" title="${escapeHtml(d.desc)}">${escapeHtml(d.desc)}</div>`:''}
            </div>
            <div class="doc-actions-wrap">
              ${isViewable ? `
                <button class="doc-viewer-btn" onclick="openDocViewer('${escapeHtml(d.name)}', '${escapeHtml(d.href||'')}', '${plat.type||'pdf'}', '${escapeHtml(d.desc||'')}')" title="Abrir visor integrado sin salir de la herramienta">
                  👁️ Ver online
                </button>
              ` : ''}
              ${d.href && d.href !== '#' ? `
                <a href="${escapeHtml(d.href)}" target="_blank" rel="noopener" class="doc-external-link" title="Abrir enlace externo">
                  Abrir ↗
                </a>
              ` : ''}
              <button onclick="deleteDoc('${p.id}',${i})" style="background:transparent;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:0 4px;opacity:0.6;transition:opacity .15s" title="Eliminar recurso" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">🗑</button>
            </div>
          </div>`
        }).join('')}
      </div>
    `:`<div class="dashed-box">
      Sin recursos vinculados.<br>
      <span style="font-size:11px;color:var(--text-3)">Añade PDFs, imágenes, Figma, Google Drive, Canva, Notion, URLs de Staging...</span>
    </div>`}
  </div>`

  const recsSection=recordatoriosSection(p)
  const tasksSection=`<div style="margin-bottom:20px">${taskTableView(p)}</div>`
  return attentionBlock + statsBar + tasksSection + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">${docsSection}${recsSection}</div>`
}

// ── Recordatorios section ──────────────────────────────────────────────────
function fmtDue(due){
  if(!due)return ''
  if(typeof due==='string' && due.includes('-') && due.length===10){
    const d=new Date(due+'T00:00')
    if(!isNaN(d.getTime())) return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})
  }
  return due
}
function recordatoriosSection(p){
  const recs=p.recordatorios||[]
  const inner = `
    <div class="rec-head">
      <div class="rec-title">🔔 Recordatorios / Temas pendientes</div>
      <button class="rec-new-btn" onclick="startAddRec()">+ Nuevo</button>
    </div>
    ${!recs.length?`<div style="font-size:12px;color:var(--text-3);padding:0 14px 14px">Sin recordatorios. Añade temas pendientes o avisos importantes.</div>`:''}
    ${recs.map((r,i)=>`
      <div class="rec-row ${r.done?'done-row':''}">
        <div class="rec-cb ${r.done?'on':''}" onclick="toggleRec('${p.id}',${i})">${r.done?'✓':''}</div>
        <div class="rec-body">
          <div class="rec-text" onclick="toggleRec('${p.id}',${i})">${escapeHtml(r.text||'')}</div>
          ${r.detail?`<div class="rec-detail">${escapeHtml(r.detail)}</div>`:''}
        </div>
        ${r.due?`<div class="rec-date">${fmtDue(r.due)}</div>`:''}
        <button class="rec-del-btn" onclick="deleteRec('${p.id}',${i})">🗑</button>
      </div>
    `).join('')}
    ${S.addingRec?`
      <div class="rec-add-row">
        <input id="rec-txt-in" class="rec-in" placeholder="Tarea o recordatorio…" style="flex:2" onkeydown="if(event.key==='Enter')confirmAddRec('${p.id}')"/>
        <input id="rec-det-in" class="rec-in" placeholder="Detalle (opcional)…" style="flex:2"/>
        <input id="rec-due-in" type="date" class="rec-in" style="width:130px;flex:none"/>
        <button class="rec-ok-btn" onclick="confirmAddRec('${p.id}')">Añadir</button>
        <button class="rec-cancel-btn" onclick="cancelAddRec()">✕</button>
      </div>
    `:''}
  `
  return `<div class="card" style="padding:0;overflow:hidden">
    <div style="padding:14px 18px 0">${inner}</div>
  </div>`
}

// ── Rich task table view ───────────────────────────────────────────────────
function taskTableView(p){
  const t=p.tasks||[]
  const pending = t.filter(x=>x.status!=='Listo')
  const done    = t.filter(x=>x.status==='Listo')
  return `
    ${tkSection(p,'pending',pending,'POR COMPLETAR','Tareas activas y pendientes','#EF4444','#FFF0F0','#C53030')}
    ${tkSection(p,'done',done,'COMPLETADAS','Trabajo ya finalizado','#22C55E','#EDFAF2','#0F9460')}
  `
}

      </div>
      <div class="tk-due">${dueFormatted}</div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel tk-prio-sel prio-${prioClass}" onchange="updateTaskField('${p.id}','${t.code}','priority',this.value)">
          ${['Alta','Media','Baja'].map(v=>`<option ${(t.pri||t.priority)===v?'selected':''}>${v}</option>`).join('')}

      </div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel tk-status-sel status-${statusSlug}" onchange="updateTaskField('${p.id}','${t.code}','status',this.value)">

        <span class="tk-eb ${lk.length?'has':''}" title="${lk.length} Enlace${lk.length!==1?'s':''}">🔗 ${lk.length}</span>

        <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">
          <input id="lnk-n-${t.code}" class="tk-in-sm" placeholder="Nombre del enlace…"/>
          <div style="display:flex;gap:4px">
            <input id="lnk-h-${t.code}" class="tk-in-sm" placeholder="https://…" style="flex:1"/>

function kanban(p, isGlobal = false){
  // 1. Recopilar tareas en el ámbito actual vinculadas a su cliente correspondiente
  let allScopeTasks = []
  if(isGlobal || !p){
    isGlobal = true
    DATA.filter(cl => cl.type === 'cliente').forEach(cl => {
      (cl.tasks || []).forEach((t, i) => {
        normTask(t, i, cl)
        allScopeTasks.push({ t, client: cl })
      })
    })
  } else {
    (p.tasks || []).forEach((t, i) => {
      normTask(t, i, p)
      allScopeTasks.push({ t, client: p })
    })
  }

  // 2. Extraer dinámicamente todos los responsables únicos y el recuento de tareas por cada uno
  const ownerCounts = {}
  allScopeTasks.forEach(({ t }) => {
    const owner = (t.owner || '').trim() || 'Sin asignar'
    ownerCounts[owner] = (ownerCounts[owner] || 0) + 1
  })
  const uniqueOwners = Object.keys(ownerCounts).sort((a,b) => a.localeCompare(b))

  // 3. Segmentación: Exactamente 1 solo Kanban visible en pantalla según la pestaña seleccionada
  const activeFilter = S.kanbanOwnerFilter || 'all'
  const displayedTasks = (activeFilter === 'all')
    ? allScopeTasks
    : allScopeTasks.filter(({ t }) => ((t.owner || '').trim() || 'Sin asignar') === activeFilter)

  const columns = [
    { id: 'Sin empezar',        title: 'Sin empezar',        icon: '📋', accent: '#64748B', bgLight: 'rgba(100,116,139,0.1)' },
    { id: 'Trabajando',          title: 'Trabajando',          icon: '⚡', accent: 'var(--brand)', bgLight: 'rgba(240,78,35,0.1)' },
    { id: 'Esperando feedback',  title: 'Esperando feedback',  icon: '⏳', accent: '#D97706', bgLight: 'rgba(217,119,6,0.1)' },
    { id: 'Listo',               title: 'Listo',               icon: '✅', accent: '#16A34A', bgLight: 'rgba(22,163,74,0.1)' }
  ]

  const quickTargetClient = p || S.proj || DATA.find(c => c.type === 'cliente')

  return `<div class="kanban-wrapper">
    <!-- Pestañitas dinámicas de responsables (Segmentación de Kanban en 1 solo tablero) -->
    <div class="k-subtabs-bar">
      <span class="k-subtabs-label">👤 Responsables:</span>
      <button class="k-subtab ${activeFilter === 'all' ? 'active' : ''}" onclick="setKanbanOwnerFilter('all')" title="Ver todas las tareas">
        <span>🌐 Vista Global</span>
        <span class="k-subtab-badge">${allScopeTasks.length}</span>
      </button>
      ${uniqueOwners.map(owner => `
        <button class="k-subtab ${activeFilter === owner ? 'active' : ''}" onclick="setKanbanOwnerFilter('${escapeHtml(owner)}')" title="Filtrar tareas de ${escapeHtml(owner)}">
          <span class="k-subtab-avatar">${escapeHtml(owner.charAt(0).toUpperCase())}</span>
          <span>${escapeHtml(owner)}</span>
          <span class="k-subtab-badge">${ownerCounts[owner]}</span>
        </button>
      `).join('')}
    </div>

    <!-- Tablero Kanban único interactivo -->
    <div class="kanban-board">
      ${columns.map(col => {
        const colItems = displayedTasks.filter(({ t }) => t.status === col.id)
        const isAdding = S._addingCardCol === col.id
        return `<div class="k-col" data-col="${col.id}"
                     ondragover="handleColDragOver(event)" 
                     ondragleave="handleColDragLeave(event)" 
                     ondrop="handleColDrop(event, '${col.id}')">
          <!-- Column Header -->
          <div class="k-col-h">
            <div class="k-col-title-wrap">
              <span class="k-col-icon">${col.icon}</span>
              <span class="k-col-title">${col.title}</span>
              <span class="k-count" style="border-left: 2px solid ${col.accent}">${colItems.length}</span>
            </div>
            <button class="k-col-add-btn" onclick="startQuickCard('${col.id}')" title="Añadir tarjeta a ${col.title}">+</button>
          </div>

          <!-- Cards List -->
          <div class="k-card-list">
            ${colItems.map(({ t, client }) => {
              const cl = t.checklist || t.checklists || []
              const clDone = cl.filter(c => c.done).length
              const isComplete = t.status === 'Listo'
              const linksCount = (t.links?.length || 0) + (t.files?.length || 0)
              const commentsCount = t.comments?.length || 0
              const hasDesc = !!(t.description || t.desc)
              const taskSem = getTaskSemaforo(t)
              const semLabel = taskSem === 'rojo' ? 'Rojo (Urgente)' : taskSem === 'naranja' ? 'Naranja (Atención)' : 'Verde (Normal)'

              return `<div class="k-card ${isComplete?'is-complete':''}" 
                           id="card-${t.code || t.id}"
                           draggable="true" 
                           ondragstart="handleCardDragStart(event, '${client.id}', '${t.code || t.id}')"
                           ondragend="handleCardDragEnd(event)"
                           ondrop="handleCardDrop(event, '${col.id}', '${t.code || t.id}')"
                           onclick="openTaskDetail('${client.id}', '${t.code || t.id}')">
                
                <!-- 1. Banda superior de color estilo Trello (Franja Semáforo de Urgencia) -->
                <div class="k-card-strip sem-${taskSem}" title="Semáforo de urgencia: ${semLabel}">
                  <div class="k-card-strip-left">
                    ${isGlobal ? `<span class="k-card-strip-client" style="border-left:2px solid ${client.color||'#fff'}">${escapeHtml(client.initials || client.name.slice(0,3))}</span>` : ''}
                    <span class="k-card-strip-code">${escapeHtml(t.code || '')}</span>
                    ${t.tag ? `<span class="k-card-strip-tag">${escapeHtml(t.tag)}</span>` : ''}
                  </div>
                  <!-- Selector rápido de semáforo (Verde, Naranja, Rojo) -->
                  <div class="k-card-strip-dots" onclick="event.stopPropagation()">
                    <span class="k-strip-dot dot-v ${taskSem==='verde'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','verde',event)" title="Semáforo: Verde (Normal)"></span>
                    <span class="k-strip-dot dot-n ${taskSem==='naranja'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','naranja',event)" title="Semáforo: Naranja (Atención / En espera)"></span>
                    <span class="k-strip-dot dot-r ${taskSem==='rojo'?'on':''}" onclick="setTaskSemaforo('${client.id}','${t.code||t.id}','rojo',event)" title="Semáforo: Rojo (Urgente)"></span>
                  </div>
                </div>

                <!-- 2. Cuerpo de la tarjeta: Título, ID / detalles, pequeños iconos -->
                <div class="k-card-body">
                  <!-- Título de la tarea -->
                  <div class="k-card-title">${escapeHtml(t.title || t.name || 'Sin título')}</div>

                  <!-- Descripción previa si existe -->
                  ${hasDesc ? `<div class="k-card-desc-snippet">${escapeHtml(t.description || t.desc)}</div>` : ''}

                  <!-- Fila auxiliar con pequeños iconos estilo Trello -->
                  <div class="k-card-aux-row">
                    <div class="k-card-icons">
                      ${hasDesc ? `<span class="k-aux-ico" title="Tiene descripción">≡</span>` : ''}
                      ${t.due ? `<span class="k-aux-ico ${isComplete?'ico-done':''}" title="Vencimiento: ${escapeHtml(t.due)}">📅 ${fmtDue(t.due)}</span>` : ''}
                      ${cl.length ? `<span class="k-aux-ico ${clDone===cl.length?'ico-done':''}" title="Checklist ${clDone}/${cl.length}">☑ ${clDone}/${cl.length}</span>` : ''}
                      ${linksCount ? `<span class="k-aux-ico" title="${linksCount} adjuntos / enlaces">📎 ${linksCount}</span>` : ''}
                      ${commentsCount ? `<span class="k-aux-ico" title="${commentsCount} comentarios">💬 ${commentsCount}</span>` : ''}
                    </div>

                    <!-- Responsable -->
                    <div class="k-card-owner" title="Responsable: ${escapeHtml(t.owner || 'Sin asignar')}">
                      <div class="k-card-avatar">${((t.owner||'J').trim().charAt(0)||'?').toUpperCase()}</div>
                      <span class="k-card-owner-name">${escapeHtml(t.owner || 'Jesús')}</span>
                    </div>
                  </div>
                </div>
              </div>`
            }).join('')}
            ${!colItems.length && !isAdding ? `<div class="k-empty-col">Arrastra tarjetas aquí</div>` : ''}
          </div>

          <!-- Bottom: Add card trigger or inline box -->
          ${isAdding ? `
            <div class="k-add-card-box">
              <textarea id="k-add-input-${col.id}" class="k-add-textarea" placeholder="Escribe un título para esta tarjeta..." 
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitQuickCard('${quickTargetClient?.id||''}','${col.id}')}"></textarea>
              <div class="k-add-actions">
                <button class="k-add-confirm-btn" onclick="submitQuickCard('${quickTargetClient?.id||''}','${col.id}')">Añadir tarjeta</button>
                <button class="k-add-cancel-btn" onclick="cancelQuickCard()">✕</button>
              </div>
            </div>
          ` : `
            <button class="k-add-card-trigger" onclick="startQuickCard('${col.id}')">
              <span>+ Añadir una tarjeta</span>
            </button>
          `}
        </div>`
      }).join('')}
    </div>
  </div>`
}

function tabla(p){
  const t=p.tasks||[]
  const chipOf=s=>s==='Trabajando'?'chip chip-working':s==='Esperando feedback'?'chip chip-waiting':s==='Listo'?'chip chip-ready':'chip chip-slate'
  return `<table class="gtable">
    <thead><tr>
      <th>Código</th><th>Tarea</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Vence</th>
    </tr></thead>
    <tbody>${t.map(x=>`<tr>
      <td class="tc">${x.code}</td>
      <td style="font-weight:500">${x.name}</td>
      <td>${x.owner}</td>
      <td><span class="${chipOf(x.status)}">${x.status}</span></td>
      <td><span class="pri ${x.priority.toLowerCase()}">${x.priority}</span></td>

function appContent(p){

function appOverview(p){
  const statusBadge=s=>s==='ok'?'ok':s==='warn'?'warn':'off'
  const statusLabel=s=>s==='ok'?'● Conectado':s==='warn'?'▲ Pendiente':'✗ Sin conectar'

  // Build flow steps from stack + conns
  const FLOW=[
    {
      ico:'🤖', name:'Claude Code',
      desc:'Aquí se escribe y modifica el código. Claude propone cambios; tú los apruebas.',
      href:'https://claude.ai/code', linkLabel:'Abrir Claude',
      badge:'ok'
    },
    {
      ico:'🐙', name:'GitHub',
      desc:'Claude hace commit y push. GitHub guarda el historial completo de cambios y versiones.',
      href: p.repo ? `https://github.com/${p.repo}` : null,
      linkLabel:'Ver repositorio',
      badge: p.repo ? 'ok' : 'off'
    },
    {
      ico:'▲', name:'Vercel',
      desc:'Detecta cada push automáticamente y publica la app. Cada rama tiene su propio preview.',
      href: (p.conns||[]).find(c=>c.name==='Vercel')?.href || 'https://vercel.com',
      linkLabel:'Panel Vercel',
      badge: (p.conns||[]).find(c=>c.name==='Vercel')?.status || 'off'
    },
    {
      ico:'🟩', name:'Supabase',
      desc:'Base de datos PostgreSQL en la nube. Almacena y sirve todos los datos de la app.',
      href: (p.conns||[]).find(c=>c.name==='Supabase')?.href || 'https://supabase.com',
      linkLabel:'Panel Supabase',
      badge: (p.conns||[]).find(c=>c.name==='Supabase')?.status || 'off'
    },
  ]

  const CONCEPTS=[
    {ico:'📦',term:'Commit',tag:'git',def:'Guarda una foto del código en ese momento, con un mensaje descriptivo del cambio.'},
    {ico:'🚀',term:'Push',tag:'git',def:'Envía los commits locales a GitHub para que queden guardados en la nube.'},
    {ico:'🌿',term:'Branch',tag:'git',def:'Versión paralela del código. Se usa para trabajar en algo nuevo sin afectar la rama principal.'},
    {ico:'🔀',term:'Merge',tag:'git',def:'Fusiona una branch con otra (normalmente con main) para integrar los cambios.'},
    {ico:'🔁',term:'Pull Request',tag:'git',def:'Propuesta formal de merge. Permite revisar y discutir los cambios antes de integrarlos.'},
    {ico:'🌐',term:'Deploy',tag:'vercel',def:'Proceso de publicar la app. Vercel lo hace automáticamente con cada push a main.'},
    {ico:'🔍',term:'Preview',tag:'vercel',def:'URL temporal que Vercel crea para cada branch. Permite probar cambios antes de publicar.'},
    {ico:'🔑',term:'Env vars',tag:'config',def:'Variables secretas (contraseñas, API keys) que la app lee en producción. Nunca van al código.'},
  ]

  const tagColor={git:'#3045D0',vercel:'#232220',config:'#7C3AED'}
  const tagBg  ={git:'rgba(61,81,232,.1)',vercel:'rgba(35,34,32,.08)',config:'rgba(124,58,237,.1)'}

  return `
  <!-- Stack pill row -->
  ${(p.stack||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
    ${(p.stack||[]).map(s=>`<span class="stack-tag">${s}</span>`).join('')}
  </div>`:''}

  <!-- Flujo de trabajo -->
  <div class="ov-section">
    <div class="ov-section-title">Cómo funciona todo junto</div>
    <div class="ov-flow">
      ${FLOW.map(s=>`
        <div class="ov-step">
          <div class="ov-step-ico">${s.ico}</div>
          <div class="ov-step-name">${s.name}</div>
          <div class="ov-step-desc">${s.desc}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px">
            ${s.href?`<a class="ov-step-link" href="${s.href}" target="_blank" rel="noopener">${s.linkLabel} ↗</a>`:'<span></span>'}
            <span class="ov-step-badge ${statusBadge(s.badge)}">${statusLabel(s.badge)}</span>
          </div>
        </div>`).join('')}
    </div>
  </div>

  <!-- Conexiones -->
  ${(p.conns||[]).length?`<div class="ov-section">
    <div class="ov-section-title">Conexiones activas</div>
    <div class="ov-conns">
      ${(p.conns||[]).map(c=>`
        <div class="ov-conn-card">
          <div class="ov-conn-head">
            <div class="ov-conn-ico">${c.ico}</div>
            <div>
              <div class="ov-conn-title">${c.name}</div>
              <div class="ov-conn-sub">${c.detail}</div>
            </div>
          </div>
          <div class="ov-conn-foot">
            ${c.href?`<a class="ov-conn-link" href="${c.href}" target="_blank" rel="noopener">Abrir ↗</a>`:`<span></span>`}
            <span class="ov-conn-status ${statusBadge(c.status)}">${statusLabel(c.status)}</span>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}

  <!-- Conceptos clave -->
  <div class="ov-section">
    <div class="ov-section-title">Conceptos clave</div>
    <div class="ov-concepts">
      ${CONCEPTS.map(c=>`
        <div class="ov-concept">
          <div class="ov-concept-term">
            <span>${c.ico}</span> ${c.term}
            <span class="ov-concept-tag" style="background:${tagBg[c.tag]};color:${tagColor[c.tag]}">${c.tag}</span>
          </div>
          <div class="ov-concept-def">${c.def}</div>
        </div>`).join('')}
    </div>
  </div>`
}

function connStatus(s){
  if(s==='ok')   return `<span class="conn-s ok">✓ Conectado</span>`
  if(s==='warn') return `<span class="conn-s warn">⚠ Pendiente</span>`
  return `<span class="conn-s off">✗ Sin conectar</span>`
}

// ─ PROVEEDOR ────────────────────────────────────────────────────────────────
function provContent(p){
  const cats=p.cats||[]
  if(!S.provCat)S.provCat=cats[0]?.id||null
  const cat=cats.find(category=>category.id===S.provCat)||cats[0]
  const esc=escapeProviderHtml
  const categoryList=cats.map(category=>
    '<div class="cat-item '+(category.id===S.provCat?'on':'')+'" onclick="setProvCat(\''+esc(category.id)+'\')">'+
      '<span class="cat-ico">'+esc(category.ico||'📁')+'</span><span class="cat-name">'+esc(category.name)+'</span><span class="cat-n">'+(category.provs||[]).length+'</span>'+
      '<button class="cat-delete" type="button" title="Eliminar categoría" onclick="deleteProviderCategory(\''+esc(category.id)+'\',event)">×</button>'+
    '</div>'
  ).join('')
  const cards=(cat?.provs||[]).map((provider,index)=>{
    const key=String(provider.id||cat.id+'_'+index)
    const open=!!S.open[key]
    const note=provider.highlightNote?'<div class="prov-card-note">'+esc(provider.highlightNote)+'</div>':''
    const fields=(provider.fields||[]).map(field=>'<div class="pf-row"><span class="pf-k">'+esc(field.k)+'</span><span class="pf-v">'+field.v+'</span></div>').join('')
    const rates=provider.prices?.length?'<div class="price-head">Tarifas</div><table class="ptable"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead><tbody>'+
      provider.prices.map(rate=>'<tr><td>'+esc(rate.prod||'')+'</td><td style="color:var(--text-3)">'+esc(rate.qty||'')+'</td><td class="price-val">'+esc(rate.price||'')+'</td></tr>').join('')+
      '</tbody></table>':''
    const products=provider.productList?'<div class="price-head">Productos / servicios</div><div class="prov-products">'+esc(provider.productList)+'</div>':''
    const actions=provider.id?'<div class="prov-card-actions"><button class="prov-card-action" type="button" onclick="openEditProvider(\''+esc(p.id)+'\',\''+esc(cat.id)+'\',\''+esc(provider.id)+'\')">Editar</button><button class="prov-card-action delete" type="button" onclick="deleteProvider(\''+esc(p.id)+'\',\''+esc(cat.id)+'\',\''+esc(provider.id)+'\',event)">Eliminar</button></div>':''
    return '<div class="prov-card"><div class="prov-card-h '+(open?'open':'')+'" onclick="toggleCard(\''+esc(key)+'\')"><div><div class="prov-card-name">'+esc(provider.name)+'</div><div class="prov-card-type">'+esc(provider.type||'Proveedor')+'</div>'+note+'</div><span class="chev '+(open?'open':'')+'">▼</span></div><div class="prov-card-body '+(open?'open':'')+'">'+fields+rates+products+actions+'</div></div>'
  }).join('')
  return '<div class="prov-layout"><div class="prov-cats"><div class="cat-list-wrap">'+categoryList+
    (S.addingCat?'<div class="cat-input-row"><input id="cat-input" class="cat-input" placeholder="Nombre categoría…" onkeydown="if(event.key===\'Enter\')confirmAddCat();if(event.key===\'Escape\')cancelAddCat()"/><button class="cat-input-ok" onclick="confirmAddCat()">OK</button></div>':'<button class="cat-add-btn" onclick="startAddCat()"><span style="font-size:15px;line-height:1">+</span> Nueva categoría</button>')+
    '</div></div><div class="prov-content"><div class="prov-folder-bar"><span class="folder-ico">'+esc(cat?.ico||'📁')+'</span><div><div class="folder-title">'+esc(cat?.name||'Sin categorías')+'</div><div class="folder-sub">'+(cat?.provs?.length||0)+' proveedores</div></div><button class="add-btn" type="button" data-provider-project="'+esc(p.id)+'" data-provider-category="'+esc(cat?.id||'')+'">+ Añadir proveedor</button></div><div class="prov-cards">'+cards+'</div></div></div>'
}

  const byDate={}

          </div>
          <div style="flex:1;border-left:2px solid var(--border-2);padding-left:16px">

// ── Restore persisted state ───────────────────────────────────────────────────
const STORE_VERSION='v11'
if(localStorage.getItem('ligrow_ver')!==STORE_VERSION){
  localStorage.removeItem('ligrow_data')
  localStorage.removeItem('ligrow_state')
  localStorage.setItem('ligrow_ver',STORE_VERSION)
}
try{
  const savedData=JSON.parse(localStorage.getItem('ligrow_data')||'null')
  if(Array.isArray(savedData) && savedData.length) DATA=savedData
}catch(e){}

// Normalizar siempre todas las tareas cargadas para prevenir inconsistencias
DATA.forEach(p=>{
  if(p.type==='cliente' && p.tasks){
    p.tasks = p.tasks.map((t,idx)=>normTask(t, idx, p))
  }
})

try{
  const savedTheme=localStorage.getItem('ligrow_theme')
  if(savedTheme && ['light','dark','auto'].includes(savedTheme)) S.theme=savedTheme
  else S.theme='light'
}catch(e){ S.theme='light' }
try{
  const st=JSON.parse(localStorage.getItem('ligrow_state')||'{}')
  if(st.filter&&['todos','clientes','apps','proveedores'].includes(st.filter))S.filter=st.filter
  if(st.projId){const found=DATA.find(x=>x.id===st.projId);if(found)S.proj=found}
  if(st.view)S.view=st.view
  if(st.navView!==undefined)S.navView=st.navView
  if(st.theme)S.theme=st.theme
  if(st.defaultUser)S.defaultUser=st.defaultUser
  if(st.kanbanOwnerFilter)S.kanbanOwnerFilter=st.kanbanOwnerFilter
}catch(e){}
try{
  const urlParams = new URLSearchParams(window.location.search)
  if(urlParams.get('proj')){
    const pFound = DATA.find(x => x.id === urlParams.get('proj'))
    if(pFound) S.proj = pFound
  }
  if(urlParams.get('view')) S.view = urlParams.get('view')
  if(urlParams.get('navView')) S.navView = urlParams.get('navView')
  if(urlParams.get('owner')) S.kanbanOwnerFilter = urlParams.get('owner')
  if(urlParams.get('theme')) S.theme = urlParams.get('theme')
  if(urlParams.get('task')){
    S.modal = 'taskDetail'
    S._taskDetail = { clientId: S.proj?.id || 'cpb', taskCode: urlParams.get('task') }
  }
  if(urlParams.get('modal')){
    S.modal = urlParams.get('modal')
    if(S.modal === 'addDoc') S._docPid = S.proj?.id || 'cpb'
    if(S.modal === 'docViewer'){
      S._docViewer = {
        title: urlParams.get('docTitle') || 'Propuesta Rediseño Web CPB.pdf',
        url: urlParams.get('docUrl') || '#',
        type: urlParams.get('docType') || 'pdf',
        desc: urlParams.get('docDesc') || 'Presentación completa de concepto visual, colores y wireframes'
      }
    }
  }
}catch(e){}

// Guard against a stale S.proj reference
if(!DATA.find(x=>x.id===S.proj?.id)) S.proj=DATA[0]||null

// Atajo de teclado: Escape cierra cualquier modal
window.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.modal) closeModal()
})

// Initialize theme (default: warm light)
applyTheme(S.theme)
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(S.theme==='auto') applyTheme('auto')
  })
}

// Start with brand orange
applyAccent('cliente')
render()
loadSupplierDirectory().catch(()=>{})
</script>
</body>
</html>
