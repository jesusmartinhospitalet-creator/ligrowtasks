<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ligrow Tasks · Personal & Project Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ── Design Tokens ────────────────────────────── */
:root {
  --bg:      #0a0a0a;
  --bg1:     #0f0f0f;
  --bg2:     #111111;
  --card:    #1a1a1a;
  --card2:   #222222;
  --border:  rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text:    #ffffff;
  --text2:   rgba(255,255,255,0.72);
  --text3:   rgba(255,255,255,0.48);
  --text4:   rgba(255,255,255,0.28);
  --orange:  #FF6B2B;
  --orange2: #FF4500;
  --pink:    #FF6BAA;
  --grad:    linear-gradient(135deg,#FF6B2B 0%,#FF4500 100%);
  --grad2:   linear-gradient(135deg,#FF6B2B 0%,#FF6BAA 55%,#FF4500 100%);
  --shadow-o: 0 4px 24px rgba(255,107,43,0.28);
  --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
  --radius:  14px;
  --radius-sm: 8px;
  --radius-pill: 50px;
  --sidebar-w: 256px;
  /* status */
  --status-curso: #3b82f6;
  --status-listo: #22c55e;
  --status-detenido: #ef4444;
  /* priority */
  --pri-alta:  #ef4444;
  --pri-media: #f59e0b;
  --pri-baja:  #22c55e;
}

/* ── Reset & Base ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }
a { text-decoration: none; color: inherit; }

/* ── Layout ───────────────────────────────────── */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ──────────────────────────────────── */
.sidebar {
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.sidebar-logo {
  padding: 20px 20px 0;
  flex-shrink: 0;
}
.sidebar-logo-text {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.04em;
  background: var(--grad2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sidebar-logo-sub {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 2px;
}
.sidebar-section {
  padding: 20px 12px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text4);
}
.sidebar-clients {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.sidebar-clients::-webkit-scrollbar { width: 4px; }
.sidebar-clients::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
.client-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 2px;
  transition: background .15s;
  position: relative;
}
.client-item:hover { background: rgba(255,255,255,0.04); }
.client-item.active {
  background: rgba(255,107,43,0.10);
  border: 1px solid rgba(255,107,43,0.25);
}
.client-avatar {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  letter-spacing: -0.5px;
}
.client-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.client-item.active .client-name { color: var(--text); font-weight: 600; }
.client-actions {
  display: none;
  gap: 2px;
}
.client-item:hover .client-actions { display: flex; }
.client-action-btn {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text3);
  background: transparent;
  transition: background .15s, color .15s;
}
.client-action-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.client-action-btn.del:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
.sidebar-footer {
  padding: 12px 8px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.btn-new-client {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px;
  border-radius: var(--radius-sm);
  background: rgba(255,107,43,0.08);
  border: 1px solid rgba(255,107,43,0.2);
  color: var(--orange);
  font-size: 13px;
  font-weight: 600;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.btn-new-client:hover {
  background: rgba(255,107,43,0.15);
  border-color: rgba(255,107,43,0.4);
  box-shadow: var(--shadow-o);
}

/* ── Main Area ────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg2);
}
.main-header {
  padding: 20px 28px 0;
  flex-shrink: 0;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
}
.main-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.main-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.main-subtitle {
  font-size: 12px;
  color: var(--text3);
  margin-top: 3px;
}
.main-actions { display: flex; gap: 8px; align-items: center; }

/* ── Buttons ──────────────────────────────────── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-pill);
  background: var(--grad);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  box-shadow: var(--shadow-o);
  transition: opacity .2s, transform .15s, box-shadow .2s;
  white-space: nowrap;
}
.btn-primary:hover { opacity: .92; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(255,107,43,0.40); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-pill);
  background: rgba(255,255,255,0.05);
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border2);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.09); color: var(--text); }
.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text3);
  font-size: 14px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-icon:hover { background: rgba(255,255,255,0.09); color: var(--text); }
.btn-danger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-pill);
  background: rgba(239,68,68,0.12);
  color: #ef4444;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(239,68,68,0.25);
  cursor: pointer;
  transition: background .2s;
}
.btn-danger:hover { background: rgba(239,68,68,0.22); }
.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}

/* ── Tabs ─────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 2px;
  padding-bottom: 0;
}
.tab {
  padding: 8px 16px;
  border-radius: 8px 8px 0 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
}
.tab:hover { color: var(--text2); background: rgba(255,255,255,0.03); }
.tab.active {
  color: var(--orange);
  font-weight: 700;
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 8px;
  right: 8px;
  height: 2px;
  background: var(--grad);
  border-radius: 2px 2px 0 0;
}

/* ── Content area ─────────────────────────────── */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.main-content::-webkit-scrollbar { width: 5px; }
.main-content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── Empty state ──────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
  color: var(--text3);
  gap: 12px;
}
.empty-state-icon { font-size: 40px; opacity: 0.4; }
.empty-state h3 { font-size: 16px; font-weight: 700; color: var(--text2); }
.empty-state p { font-size: 13px; max-width: 280px; }

/* ── Badges ───────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.badge-curso   { background: rgba(59,130,246,0.15);  color: #60a5fa; }
.badge-listo   { background: rgba(34,197,94,0.15);   color: #4ade80; }
.badge-detenido{ background: rgba(239,68,68,0.15);   color: #f87171; }
.badge-alta    { background: rgba(239,68,68,0.12);   color: #fca5a5; }
.badge-media   { background: rgba(245,158,11,0.12);  color: #fbbf24; }
.badge-baja    { background: rgba(34,197,94,0.12);   color: #86efac; }
.badge-tag {
  background: rgba(255,107,43,0.10);
  color: var(--orange);
  border: 1px solid rgba(255,107,43,0.2);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 8px;
}
.owner-dot {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}
.owner-jesus    { background: rgba(255,107,43,0.2);  color: var(--orange); }
.owner-blanca   { background: rgba(255,107,170,0.2); color: var(--pink); }
.owner-alejandro{ background: rgba(59,130,246,0.2);  color: #60a5fa; }
.owner-default  { background: rgba(255,255,255,0.08); color: var(--text3); }

/* ── Kanban ───────────────────────────────────── */
.kanban {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  align-items: start;
}
.kanban-col {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.kanban-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.kanban-col-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
}
.kanban-col-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.col-curso   .kanban-col-dot { background: var(--status-curso); }
.col-detenido .kanban-col-dot { background: var(--status-detenido); }
.col-listo   .kanban-col-dot { background: var(--status-listo); }
.kanban-count {
  font-size: 11px;
  font-weight: 700;
  background: rgba(255,255,255,0.07);
  color: var(--text3);
  padding: 2px 7px;
  border-radius: 50px;
}
.kanban-cards { padding: 10px; min-height: 60px; }
.task-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .15s, transform .15s, box-shadow .15s;
  position: relative;
  overflow: hidden;
}
.task-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
}
.task-card.pri-alta::before   { background: var(--pri-alta); }
.task-card.pri-media::before  { background: var(--pri-media); }
.task-card.pri-baja::before   { background: var(--pri-baja); }
.task-card:hover {
  border-color: rgba(255,107,43,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.task-card-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.4;
  padding-left: 6px;
}
.task-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-left: 6px;
}
.task-card-code {
  font-size: 10px;
  color: var(--text4);
  font-weight: 600;
  letter-spacing: 0.5px;
}
.task-card-dates {
  font-size: 11px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 4px;
}
.task-card-dates.overdue { color: #f87171; }
.kanban-add-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px;
  border-radius: 0 0 var(--radius) var(--radius);
  background: transparent;
  border: none;
  border-top: 1px solid var(--border);
  color: var(--text3);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.kanban-add-btn:hover { background: rgba(255,107,43,0.06); color: var(--orange); }

/* ── Table ────────────────────────────────────── */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th {
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  text-align: left;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 11px 16px;
  font-size: 13px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr {
  cursor: pointer;
  transition: background .12s;
}
.data-table tbody tr:hover { background: rgba(255,255,255,0.025); }
.task-name-cell { color: var(--text); font-weight: 500; }
.due-date-overdue { color: #f87171; }

/* ── Gantt ────────────────────────────────────── */
.gantt-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.gantt-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
}
.gantt-row {
  display: grid;
  grid-template-columns: 200px 1fr;
  align-items: center;
  border-bottom: 1px solid var(--border);
  min-height: 44px;
}
.gantt-row:last-child { border-bottom: none; }
.gantt-row-name {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  border-right: 1px solid var(--border);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gantt-bar-cell { padding: 8px 16px; }
.gantt-bar {
  height: 20px;
  background: var(--grad);
  border-radius: 50px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 10px;
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
  min-width: 120px;
}

/* ── Templates ────────────────────────────────── */
.templates-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.template-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: border-color .15s, box-shadow .15s;
}
.template-card:hover {
  border-color: rgba(255,107,43,0.25);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.template-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 8px;
}
.template-card-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.template-card-actions { display: flex; gap: 4px; flex-shrink: 0; }
.template-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.template-inactive { opacity: 0.5; }

/* ── Months ───────────────────────────────────── */
.months-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}
.month-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: border-color .15s;
}
.month-card:hover { border-color: var(--border2); }
.month-card-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.month-card-status { margin-bottom: 14px; }
.month-card-actions { display: flex; gap: 8px; }

/* ── Section header ───────────────────────────── */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.section-tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 6px;
}
.section-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

/* ── Modal ────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .2s cubic-bezier(.34,1.26,.64,1);
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.modal.modal-sm { max-width: 380px; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 24px 0;
  margin-bottom: 20px;
}
.modal-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.modal-close {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text3);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.modal-body { padding: 0 24px 24px; }

/* ── Form fields ──────────────────────────────── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-grid .full { grid-column: 1 / -1; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-label {

/* ── API ───────────────────────────────────────── */
const IS_PREVIEW = typeof window !== 'undefined' && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1');

function getMockForUrl(url = '') {
  if (url.startsWith('/tasks') || url.includes('/tasks/')) return SEED_TASKS;
  if (url.startsWith('/clients') || url.includes('/clients/')) return SEED_CLIENTS;
  return [];
}

async function api(url, opts = {}) {
  if (IS_PREVIEW) {
    if (!opts.method || opts.method === 'GET') {
      return getMockForUrl(url);
    }
    return { success: true };
  }

  try {
    const res = await fetch('/api' + url, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`HTTP status ${res.status}`);
    try {
      return JSON.parse(text);
    } catch (_jsonErr) {
      return getMockForUrl(url);
    }
  } catch (err) {
    console.warn(`[API Fallback for ${url}]:`, err.message);
    return getMockForUrl(url);
  }
}

/* ── Toast ─────────────────────────────────────── */
let toastEl = document.createElement('div');
toastEl.id = 'toast-container';
document.body.appendChild(toastEl);

function toast(msg, type = 'ok') {
  const icons = { ok: '✓', err: '✕', info: 'ℹ' };
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span class="toast-icon">${icons[type] || '•'}</span><span>${msg}</span>`;
  toastEl.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, 3200);
}

/* ── Modal ─────────────────────────────────────── */
async function openModal(type, data = {}) {
  S.modal = { type, data };
  if (type === 'task' && data.taskId) {
    try {
      const comments = await api('/comments/task/' + data.taskId);
      S.comments[data.taskId] = comments;
    } catch (e) {
      console.error('Error fetching comments:', e);
    }
  }
  renderModal();
}

function closeModal() {
  S.modal = null;
  const el = document.getElementById('modal-overlay');
  if (el) el.remove();
}

function renderModal() {
  const old = document.getElementById('modal-overlay');
  if (old) old.remove();
  if (!S.modal) return;

  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = buildModal(S.modal.type, S.modal.data);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', escListener);

  const form = overlay.querySelector('form');
  if (form) form.addEventListener('submit', handleFormSubmit);

  const typeSelect = overlay.querySelector('[name="taskType"]');
  if (typeSelect) toggleMonthField(typeSelect);
}

function escListener(e) {
  if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escListener); }
}

function buildModal(type, data) {
  if (type === 'task')     return modalTask(data);
  if (type === 'client')   return modalClient(data);
  if (type === 'template') return modalTemplate(data);
  if (type === 'confirm')  return modalConfirm(data);
  return '';
}

/* ── Form Submit Handler ───────────────────────── */
async function handleFormSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const type = form.dataset.type;
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());

  if (type === 'task') {
    // Parse subtasks from DOM
    const subtaskEls = form.querySelectorAll('#modal-subtask-list .subtask-item');
    const subtasks = [];
    subtaskEls.forEach((el, i) => {
      const text = el.querySelector('span')?.innerText || '';
      const completed = el.querySelector('input[type="checkbox"]')?.checked || false;
      if (text.trim()) subtasks.push({ id: `s${i+1}`, text: text.trim(), completed });
    });
    data.subtasks = subtasks;

    // Parse attachments from DOM
    const attachmentEls = form.querySelectorAll('#modal-attachment-list .attachment-chip');
    const attachments = [];
    attachmentEls.forEach((el) => {
      const a = el.querySelector('a');
      if (a) {
        attachments.push({ title: a.innerText, url: a.getAttribute('href') });
      }
    });
    data.attachments = attachments;

    // Parse tags
    const tagsRaw = data.tags || '';
    data.tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0).map(t => t.startsWith('#') ? t : `#${t}`);
  }

  try {
    if (type === 'task')     await api('/tasks',     { method: 'POST', body: JSON.stringify(data) });
    if (type === 'client')   await api('/clients',   { method: 'POST', body: JSON.stringify(data) });
    if (type === 'template') await api('/templates', { method: 'POST', body: JSON.stringify(data) });

    closeModal();
    toast(data.taskId || data.clientId || data.templateId ? 'Guardado correctamente' : 'Creado correctamente');
    await loadAll();
  } catch (err) {
    toast(err.message || 'Error al guardar', 'err');
  }
}

/* ── Pins (Pinned tasks) ───────────────────────── */
function getPins() {
  try { return new Set(JSON.parse(localStorage.getItem('lg-pins') || '[]')); }
  catch (e) { return new Set(); }
}
function togglePin(taskId, e) {
  if (e) e.stopPropagation();
  const pins = getPins();
  if (pins.has(taskId)) pins.delete(taskId); else pins.add(taskId);
  localStorage.setItem('lg-pins', JSON.stringify([...pins]));
  render();
}

/* ── Filtering Logic ────────────────────────────── */
function getFilteredTasks() {
  let list = S.activeClient ? S.tasks : S.allTasks;

  // Workspace filter
  if (S.workspace !== 'all') {
    const clientMap = new Map(S.clients.map(c => [c.clientId, c.category || 'personal']));
    list = list.filter(t => clientMap.get(t.clientId) === S.workspace);
  }

  // Search filter
  if (S.searchQuery.trim()) {
    const q = S.searchQuery.toLowerCase();
    list = list.filter(t =>
      (t.taskName || '').toLowerCase().includes(q) ||
      (t.taskCode || '').toLowerCase().includes(q) ||
      (t.description || '').toLowerCase().includes(q) ||
      (t.tags || []).some(tag => tag.toLowerCase().includes(q))
    );
  }

  // Tag filter
  if (S.selectedTag) {
    list = list.filter(t => (t.tags || []).includes(S.selectedTag));
  }

  return list;
}

/* ── Navigation ────────────────────────────────── */
function setView(v) {
  S.view = v;
  render();
}

function setWorkspace(ws) {
  S.workspace = ws;
  render();
}

function setTagFilter(tag) {
  S.selectedTag = S.selectedTag === tag ? '' : tag;
  render();
}

function selectClient(clientId) {
  const c = S.clients.find(x => x.clientId === clientId);
  if (!c) return;
  S.activeClient = c;
  S.view = 'kanban';
  loadClientTasks(clientId);
}

function goHome() {
  S.activeClient = null;
  S.view = 'home';
  render();
}

/* ── Data Fetching ─────────────────────────────── */
async function loadAll() {
  S.loading = true;
  render();
  try {
    const [clients, tasks] = await Promise.all([
      api('/clients'),
      api('/tasks'),
    ]);
    S.clients  = Array.isArray(clients) && clients.length ? clients : SEED_CLIENTS;
    S.allTasks = Array.isArray(tasks) && tasks.length ? tasks : SEED_TASKS;

    if (S.activeClient) {
      const updated = S.clients.find(c => c.clientId === S.activeClient.clientId);
      S.activeClient = updated || null;
      if (S.activeClient) await loadClientTasks(S.activeClient.clientId);
    }
  } catch (err) {
    console.error('Error loading data:', err);
    S.clients = SEED_CLIENTS;
    S.allTasks = SEED_TASKS;
  } finally {
    S.loading = false;
    render();
  }
}

async function loadClientTasks(clientId) {
  try {
    const [tasks, templates, months] = await Promise.all([
      api('/tasks/client/' + clientId),
      api('/templates/client/' + clientId),
      api('/months/client/' + clientId),
    ]);
    S.tasks     = tasks;
    S.templates = templates;
    S.months    = months;
  } catch (err) {
    toast('Error cargando datos del cliente: ' + err.message, 'err');
  }
}

/* ── Render Main Root ──────────────────────────── */
function render() {
  const container = document.getElementById('app');
  if (container) {
    container.innerHTML = renderSidebar() + renderContent();
  }
}

/* ── Content Container ─────────────────────────── */

  const tabs = S.activeClient
    ? VIEWS_CLIENT.map(v => `<button class="tab ${S.view === v ? 'active' : ''}" onclick="setView('${v}')">${VIEW_LABELS[v]}</button>`).join('')
    : VIEWS_GLOBAL.map(v => `<button class="tab ${S.view === v ? 'active' : ''}" onclick="setView('${v}')">${VIEW_LABELS[v]}</button>`).join('');

  return `
  <div class="main">
    <div class="main-header">
      <div class="main-header-top">
        <div>
          <div class="main-title">${esc(activeTitle)}</div>
          ${S.activeClient?.concept ? `<div class="main-subtitle">${esc(S.activeClient.concept)}</div>` : '<div class="main-subtitle">Gestión Integral de Proyectos y Tareas Personales</div>'}

function renderActiveView() {
  if (S.view === 'home')      return renderHome();
  if (S.view === 'projects')  return renderProjects();
  if (S.view === 'calendar')  return renderCalendar();
  if (S.view === 'kanban')    return renderKanban();
  if (S.view === 'table')     return renderTable();
  if (S.view === 'gantt')     return renderGantt();
  if (S.view === 'templates') return renderTemplates();
  if (S.view === 'months')    return renderMonths();
  return '';
}

/* ── Home / Dashboard View (Limpio y Minimalista) ─────────── */
function renderHome() {
  const tasks = getFilteredTasks();
  const todayStr = new Date().toISOString().substring(0, 10);
  const in7Str   = new Date(Date.now() + 7*84600000).toISOString().substring(0, 10);

  const active = tasks.filter(t => t.status !== 'Listo');
  const overdue = active.filter(t => t.dueDate && t.dueDate < todayStr);
  const critical = active.filter(t => t.priority === 'Alta');
  const thisWeek = active.filter(t => t.dueDate && t.dueDate >= todayStr && t.dueDate <= in7Str);

  return `
  <div class="home-grid">
    <!-- Stat Banner Limpio -->
    <div class="home-banner">
      <div class="home-stat-card ${overdue.length ? 'home-stat-alert' : ''}">
        <div class="home-stat-num">${overdue.length}</div>
        <div class="home-stat-label">Vencidas / Críticas</div>
      </div>
      <div class="home-stat-card">
        <div class="home-stat-num">${thisWeek.length}</div>
        <div class="home-stat-label">Próximos 7 Días</div>
      </div>
      <div class="home-stat-card">
        <div class="home-stat-num">${active.length}</div>
        <div class="home-stat-label">Tareas Abiertas</div>
      </div>
      <div class="home-stat-card">
        <div class="home-stat-num">${tasks.filter(t => t.status === 'Listo').length}</div>
        <div class="home-stat-label">Completadas</div>
      </div>
    </div>

    <!-- Tareas Vencidas y Críticas -->
    <div style="display:flex;flex-direction:column;gap:20px;">
      ${overdue.length || critical.length ? `
        <div class="home-section">
          <div class="home-section-title home-section-alert">🚨 Prioridades Críticas & Vencidas (${overdue.length + critical.length})</div>
          <div class="home-task-list">
            ${[...new Set([...overdue, ...critical])].map(t => renderHomeTaskRow(t, true)).join('')}
          </div>
        </div>
      ` : ''}

      <div class="home-section">
        <div class="home-section-title">📋 Tareas para esta semana (${thisWeek.length})</div>
        <div class="home-task-list">
          ${thisWeek.length ? thisWeek.map(t => renderHomeTaskRow(t)).join('') : '<div class="home-empty">No hay tareas urgentes programadas. ¡Todo ordenado!</div>'}

      </div>
    </div>
  </div>`;
}

  const attachments = t.attachments || [];

  return `

    <div class="home-task-date ${isAlert ? 'overdue' : ''}">${t.dueDate || 'Sin fecha'}</div>
    <div>
      <div class="home-task-name">${esc(t.taskName)}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
        ${subtasks.length ? `
          <div class="subtasks-progress" style="margin-top:0;">
            <div class="progress-bar-sm"><div class="progress-fill-sm" style="width:${(completedSub/subtasks.length)*100}%"></div></div>
            <span>${completedSub}/${subtasks.length}</span>

        ${attachments.length ? `<span style="font-size:11px;color:var(--text3);">📎 ${attachments.length} adjuntos</span>` : ''}

}

/* ── Calendar View ─────────────────────────────── */
function renderCalendar() {
  const date = S.calendarDate;
  const year = date.getFullYear();
  const month = date.getMonth();

  const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;

  const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
  const tasks = getFilteredTasks();
  const todayStr = new Date().toISOString().substring(0, 10);

  let cells = [];

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startOffset + 1;
    const isCurrentMonth = dayNum > 0 && dayNum <= lastDay.getDate();
    let cellDateStr = '';

    if (isCurrentMonth) {
      const mStr = String(month + 1).padStart(2, '0');
      const dStr = String(dayNum).padStart(2, '0');
      cellDateStr = `${year}-${mStr}-${dStr}`;
    }

    const dayTasks = isCurrentMonth ? tasks.filter(t => t.dueDate === cellDateStr) : [];
    const isToday = cellDateStr === todayStr;

    cells.push(`
      <div class="calendar-cell ${isToday ? 'today' : ''} ${!isCurrentMonth ? 'other-month' : ''}">
        <div class="calendar-date-num">${isCurrentMonth ? dayNum : ''}</div>
        ${dayTasks.map(t => `
          <div class="calendar-task-chip ${t.status.toLowerCase().replace(' ', '-')}" onclick="openModal('task',${JSON.stringify(t).replace(/"/g,'&quot;')})">
            ${esc(t.taskName)}
          </div>
        `).join('')}
      </div>
    `);
  }

  return `
  <div class="calendar-view">
    <div class="calendar-header">
      <div class="calendar-title">${monthNames[month]} ${year}</div>
      <div class="calendar-controls">
        <button class="btn-secondary btn-sm" onclick="changeMonth(-1)">◀ Anterior</button>
        <button class="btn-secondary btn-sm" onclick="S.calendarDate=new Date();render();">Hoy</button>
        <button class="btn-secondary btn-sm" onclick="changeMonth(1)">Siguiente ▶</button>
      </div>
    </div>
    <div class="calendar-grid">
      <div class="calendar-day-header">Lun</div>
      <div class="calendar-day-header">Mar</div>
      <div class="calendar-day-header">Mié</div>
      <div class="calendar-day-header">Jue</div>
      <div class="calendar-day-header">Vie</div>
      <div class="calendar-day-header">Sáb</div>
      <div class="calendar-day-header">Dom</div>
      ${cells.join('')}
    </div>
  </div>`;
}

function changeMonth(delta) {
  const d = new Date(S.calendarDate);
  d.setMonth(d.getMonth() + delta);
  S.calendarDate = d;
  render();
}

/* ── Kanban View ───────────────────────────────── */
function renderKanban() {
  return `<div class="kanban">
    ${STATUSES.map(s => renderKanbanCol(s)).join('')}

  const allTasks = getFilteredTasks();

  return `

    <div class="kanban-cards">

      <span class="kanban-card-code">${t.taskCode || ''}</span>

        <span>${completedSub}/${subtasks.length}</span>
      </div>

    ${attachments.length ? `
      <div style="font-size:11px;color:var(--text3);margin-top:6px;">📎 ${attachments.length} archivo(s)/enlace(s)</div>

      <div style="font-size:11px;color:var(--text3);">${t.owner || ''}</div>

/* ── Gantt View ────────────────────────────────── */
function renderGantt() {
  const tasks = getFilteredTasks().filter(t => t.startDate && t.dueDate);
  if (!tasks.length) return `<div class="empty-state"><h3>Sin fechas de cronograma</h3><p>Asigna fecha de inicio y entrega a las tareas para ver el cronograma.</p></div>`;

  return `
  <div style="display:flex;flex-direction:column;gap:12px;">
    ${tasks.map(t => `
      <div style="background:var(--card);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;gap:16px;">
        <div style="width:200px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.taskName)}</div>
        <div style="flex:1;background:rgba(255,255,255,0.05);height:24px;border-radius:12px;position:relative;overflow:hidden;">
          <div style="position:absolute;left:10%;width:60%;height:100%;background:var(--grad);border-radius:12px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:700;">
            ${t.startDate} → ${t.dueDate}
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

/* ── Templates & Months Views ──────────────────── */
function renderTemplates() {
  return `<div class="home-empty">Plantillas de tareas cargadas.</div>`;
}
function renderMonths() {
  return `<div class="home-empty">Historial mensual cargado.</div>`;
}
