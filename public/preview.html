<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ligrow Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ── Reset ─────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}

/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  --ink:        #131210;
  --paper:      #F7F6F3;
  --surface:    #FFFFFF;
  --surface-2:  #FAFAF8;
  --border:     #E4E2DC;
  --border-2:   #EDECE8;
  --text-1:     #1A1916;
  --text-2:     #5C5A55;
  --text-3:     #9A9890;
  --sidebar-bg: #131210;
  --sidebar-border: rgba(255,255,255,.07);
  --sidebar-text: rgba(255,255,255,.45);
  --sidebar-text-hover: rgba(255,255,255,.8);
  --sidebar-active-bg: rgba(255,255,255,.08);
  /* brand color — always Ligrow orange, never changes */
  --brand:        #F04E23;
  /* accent shifts per project type in main area only */
  --accent:       #F04E23;
  --accent-light: #FFF1EC;
  --accent-text:  #F04E23;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:      #1C1B18;
    --surface:    #232220;
    --surface-2:  #1A1916;
    --border:     #33312A;
    --border-2:   #2B2925;
    --text-1:     #F0EDE7;
    --text-2:     #A09D97;
    --text-3:     #605E58;
  }
}
:root[data-theme="dark"]{
  --paper:      #1C1B18;
  --surface:    #232220;
  --surface-2:  #1A1916;
  --border:     #33312A;
  --border-2:   #2B2925;
  --text-1:     #F0EDE7;
  --text-2:     #A09D97;
  --text-3:     #605E58;
}

/* ── Layout shell ────────────────────────────────────────────────────────── */
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--sidebar-bg);
  color:var(--text-1);
  height:100vh;
  overflow:hidden;
  font-size:14px;
  line-height:1.5;
}
#app{display:grid;grid-template-columns:244px 1fr;height:100vh}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sb{
  background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  border-right:1px solid var(--sidebar-border);
  overflow:hidden;
  position:relative;
}
.sb-head{padding:20px 16px 14px;flex-shrink:0}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px;background:linear-gradient(90deg,#ff6b2b,#ff4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:2px}
.filter-strip{display:flex;gap:3px;margin-top:14px;background:rgba(255,255,255,.04);border-radius:7px;padding:3px}
.fc{flex:1;padding:5px 2px;border:none;background:transparent;color:rgba(255,255,255,.35);font-size:10.5px;font-weight:600;border-radius:5px;transition:all .15s;letter-spacing:.2px}
.fc.on{background:rgba(255,255,255,.1);color:#fff}
.fc:hover:not(.on){color:rgba(255,255,255,.6)}

.sb-nav{padding:10px 8px;border-bottom:1px solid var(--sidebar-border);flex-shrink:0}
.nv{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;color:var(--sidebar-text);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s}
.nv:hover{background:rgba(255,255,255,.05);color:var(--sidebar-text-hover)}
.nv.on{color:#fff;background:rgba(255,255,255,.07)}
.nv-icon{width:16px;flex-shrink:0;opacity:.6}
.nv.on .nv-icon{opacity:1}
.nv-tail{margin-left:auto;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.2)}
.nv-badge{margin-left:auto;background:var(--brand);color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
.nv.on{color:#fff !important;background:rgba(255,255,255,.07)}

.sb-list{flex:1;overflow-y:auto;padding:6px 8px 16px}
.sb-list::-webkit-scrollbar{width:0}
.sl-label{font-size:9.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.2);padding:12px 8px 5px}
.pi{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:1px}
.pi:hover{background:rgba(255,255,255,.05)}
.pi.on{background:rgba(255,255,255,.08)}

/* Avatar wrappers — shape differs by type */
.pi-av-wrap{position:relative;flex-shrink:0;width:30px;height:30px}
.pi-av{
  width:30px;height:30px;
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  color:#fff;letter-spacing:.5px;
  position:absolute;inset:0;transition:filter .15s
}
/* Shapes by type */
.pi-av.shape-cliente{border-radius:7px}
.pi-av.shape-app{border-radius:50%}
.pi-av.shape-proveedor{
  border-radius:7px;
  background:transparent !important;
  border:1.5px solid rgba(255,255,255,.25);
  font-size:12px
}
/* Type badge — tiny icon bottom-right */
.pi-badge{
  position:absolute;bottom:-2px;right:-2px;
  width:13px;height:13px;border-radius:50%;
  background:#131210;
  border:1.5px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:7px;line-height:1;
}

.pi-info{flex:1;overflow:hidden}
.pi-name{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.pi.on .pi-name{color:#fff}
.pi-sub{font-size:10.5px;color:rgba(255,255,255,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.5px}
.pi-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;opacity:.6}
.pi.sem-verde {background:rgba(34,197,94,.13)}
.pi.sem-verde.on{background:rgba(34,197,94,.22)}
.pi.sem-naranja{background:rgba(245,158,11,.13)}
.pi.sem-naranja.on{background:rgba(245,158,11,.22)}
.pi.sem-rojo   {background:rgba(239,68,68,.13)}
.pi.sem-rojo.on{background:rgba(239,68,68,.22)}
/* sidebar legend */
.sb-legend{padding:10px 8px 12px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-legend-row{display:flex;align-items:center;gap:7px;padding:3px 8px;font-size:10.5px;color:rgba(255,255,255,.32);line-height:1.4}
.sb-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── Main ────────────────────────────────────────────────────────────────── */
.mn{display:flex;flex-direction:column;background:var(--paper);overflow:hidden}

/* topbar */
.tb{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 28px;
  flex-shrink:0;
}
.tb-row1{display:flex;align-items:center;gap:14px;padding:16px 0 12px}
.proj-av-lg-wrap{position:relative;flex-shrink:0;width:40px;height:40px}
.proj-av-lg{
  position:absolute;inset:0;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:#fff;letter-spacing:.5px
}
.proj-av-lg.shape-cliente{border-radius:9px}
.proj-av-lg.shape-app{border-radius:50%}
.proj-av-lg.shape-proveedor{
  border-radius:10px;background:transparent !important;
  border:2px solid var(--accent);color:var(--accent);
  font-size:16px
}
.proj-av-badge{
  position:absolute;bottom:-1px;right:-1px;
  width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1
}
.proj-title-wrap{flex:1}
.proj-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:17px;color:var(--text-1);letter-spacing:-.1px;line-height:1.2}
.proj-sub-text{font-size:12px;color:var(--text-3);margin-top:2px}
.type-pill{padding:3px 9px;border-radius:20px;font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:var(--accent-light);color:var(--accent-text);transition:all .3s}
.tb-action{padding:8px 15px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;transition:background .3s;white-space:nowrap}
.tb-action:hover{opacity:.9}

/* tabs */
.tabs{display:flex;gap:0;margin:0 -28px;padding:0 28px}
.tab{
  padding:9px 16px;border:none;background:transparent;
  font-size:12.5px;font-weight:500;color:var(--text-3);
  border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap
}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:600}

/* content area */
.ct{flex:1;overflow-y:auto;padding:22px 28px 28px}
.ct::-webkit-scrollbar{width:4px}
.ct::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── Shared content components ───────────────────────────────────────────── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.stat-lbl{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.stat-val{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-1);line-height:1}
.stat-val.accent{color:var(--accent)}
.stat-val.green{color:#0F9460}

/* two-col info grid */
.info-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:18px 20px}
.card-head{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
.dashed-box{border:1.5px dashed var(--border);border-radius:7px;padding:18px;text-align:center;color:var(--text-3);font-size:12px}

/* task rows inside cards */
.t-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-2)}
.t-row:last-child{border-bottom:none}
.t-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.t-name{font-size:13px;font-weight:500;color:var(--text-1);flex:1;line-height:1.3}
.t-owner{font-size:11px;color:var(--text-3)}
.chip{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.chip-orange{background:#FFF0EB;color:#D63A0F}
.chip-amber{background:#FFFBEC;color:#B07B00}
.chip-green{background:#EDFAF2;color:#0F9460}
.chip-red{background:#FFF0F0;color:#C53030}

/* ── Kanban ──────────────────────────────────────────────────────────────── */
.kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.k-col{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px}
.k-col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.k-col-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}
.k-count{font-size:10.5px;font-weight:600;background:var(--surface-2);border-radius:20px;padding:1px 7px;color:var(--text-3);border:1px solid var(--border-2)}
.kc{
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:8px;padding:11px 13px;margin-bottom:7px;
  border-left-width:3px;border-left-style:solid;border-left-color:var(--border)
}
.kc.alta{border-left-color:#D63A0F}
.kc.media{border-left-color:#D48000}
.kc.baja{border-left-color:#0F9460}
.kc-code{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--text-3);margin-bottom:4px}
.kc-name{font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:9px;line-height:1.35}
.kc-foot{display:flex;align-items:center;justify-content:space-between}
.kc-owner{font-size:11px;color:var(--text-3)}
.pri{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.pri.alta{background:#FFF0EB;color:#D63A0F}
.pri.media{background:#FFFBEC;color:#B07B00}
.pri.baja{background:#EDFAF2;color:#0F9460}
.k-empty{font-size:12px;color:var(--text-3);padding:6px 0 2px}

/* ── Tabla ───────────────────────────────────────────────────────────────── */
.gtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.gtable th{
  text-align:left;padding:9px 14px;font-size:9.5px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--border);background:var(--surface-2)
}
.gtable td{padding:11px 14px;border-bottom:1px solid var(--border-2);color:var(--text-1)}
.gtable tr:last-child td{border-bottom:none}
.gtable tbody tr:hover td{background:var(--surface-2)}
.tc{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-3)}

/* ── App: overview + conexiones ──────────────────────────────────────────── */
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.app-stack-wrap{display:flex;flex-wrap:wrap;gap:6px}
.stack-tag{padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border-2)}
.repo-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;margin-top:14px}
.repo-name{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--text-1)}
.repo-link{font-size:11px;font-weight:600;color:var(--accent);margin-top:1px}

.conn-list{display:flex;flex-direction:column;gap:7px}
.conn-row{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px}
.conn-ico{width:32px;height:32px;border-radius:7px;font-size:18px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border-2);flex-shrink:0}
.conn-body{flex:1;min-width:0}
.conn-name{font-size:13px;font-weight:600;color:var(--text-1)}
.conn-detail{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn-s{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.conn-s.ok{color:#0F9460}
.conn-s.warn{color:#B07B00}
.conn-s.off{color:#C53030}
.conn-link{font-size:10.5px;font-weight:600;color:var(--accent);margin-top:2px;cursor:pointer}

/* App: docs */
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-2)}
.doc-row:last-child{border-bottom:none}
.doc-name{font-size:13px;font-weight:500;color:var(--text-1)}
.doc-link{font-size:11.5px;font-weight:600;color:var(--accent);cursor:pointer}

/* App: env vars */
.env-table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace}
.env-table td{padding:8px 12px;border-bottom:1px solid var(--border-2);font-size:12px;vertical-align:middle}
.env-table tr:last-child td{border-bottom:none}
.env-key{color:var(--text-1);font-weight:500;width:50%}
.env-val{color:var(--text-3);background:var(--surface-2);border-radius:4px;padding:3px 8px;font-size:11px}
.env-note{font-size:11.5px;color:var(--text-3);margin-top:12px;font-family:'DM Sans',sans-serif;line-height:1.5}

/* ── Proveedores ─────────────────────────────────────────────────────────── */
.prov-layout{display:flex;gap:16px;height:100%;min-height:0}
.prov-cats{width:188px;flex-shrink:0}
.cat-list-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.cat-item{
  display:flex;align-items:center;gap:9px;padding:10px 13px;
  cursor:pointer;border-bottom:1px solid var(--border-2);transition:all .15s
}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{background:var(--surface-2)}
.cat-item.on{background:var(--accent-light)}
.cat-ico{font-size:17px;width:24px;text-align:center}
.cat-name{font-size:13px;font-weight:500;color:var(--text-2)}
.cat-item.on .cat-name{color:var(--accent-text);font-weight:600}
.cat-n{margin-left:auto;font-size:10px;font-weight:600;color:var(--text-3)}
.cat-item.on .cat-n{color:var(--accent-text);opacity:.7}
.cat-add-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;cursor:pointer;
  border-top:1px solid var(--border-2);
  color:var(--text-3);font-size:12px;font-weight:600;
  transition:all .15s;background:transparent;width:100%;border-radius:0 0 11px 11px;
  border-left:none;border-right:none;border-bottom:none;font-family:inherit
}
.cat-add-btn:hover{background:var(--surface-2);color:var(--accent-text)}

/* inline category name input */
.cat-input-row{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-top:1px solid var(--border-2);
  background:var(--surface-2)
}
.cat-input{
  flex:1;border:1px solid var(--border);border-radius:6px;
  padding:5px 9px;font-size:12.5px;font-family:inherit;
  background:var(--surface);color:var(--text-1);outline:none
}
.cat-input:focus{border-color:var(--accent)}
.cat-input-ok{
  padding:5px 10px;border-radius:6px;border:none;
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;font-family:inherit
}

.prov-content{flex:1;overflow-y:auto;min-width:0}
.prov-content::-webkit-scrollbar{width:4px}
.prov-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.prov-folder-bar{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:14px 18px;margin-bottom:12px
}
.folder-ico{font-size:24px}
.folder-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;color:var(--text-1)}
.folder-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.add-btn{margin-left:auto;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:12px;font-weight:600;transition:all .15s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}

.prov-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prov-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.prov-card-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;cursor:pointer;transition:background .15s;user-select:none
}
.prov-card-h:hover{background:var(--surface-2)}
.prov-card-h.open{background:var(--surface-2)}
.prov-card-name{font-size:13.5px;font-weight:600;color:var(--text-1)}
.prov-card-type{font-size:11px;color:var(--text-3);margin-top:1px}
.chev{font-size:11px;color:var(--text-3);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.prov-card-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border-2)}
.prov-card-body.open{display:block}
.pf-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border-2);font-size:12.5px}
.pf-row:last-child{border-bottom:none}
.pf-k{color:var(--text-3);font-weight:500;flex-shrink:0;width:76px}
.pf-v{color:var(--text-1);text-align:right;word-break:break-word}
.pf-v a{color:var(--accent);font-weight:600}
.price-head{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin:12px 0 6px}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{text-align:left;padding:4px 6px;color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border-2)}
.ptable td{padding:6px 6px;border-bottom:1px solid var(--border-2);color:var(--text-1)}

.price-val{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

.kc-prog-fill{height:100%;border-radius:2px;background:var(--accent)}

.kc-att{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text-3);background:var(--border-2);padding:2px 5px;border-radius:4px;white-space:nowrap}
.kc-link{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--accent-text);background:var(--accent-light);padding:2px 6px;border-radius:4px;white-space:nowrap;cursor:pointer}

.kc-chk-item{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--text-2);line-height:1.35}
.kc-chk-item.done{color:var(--text-3);text-decoration:line-through}
.kc-chk-box{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:8px}

/* ── Nueva tarea panel ───────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:stretch;justify-content:flex-end}
.modal-panel{width:360px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;animation:slideIn .2s ease}

.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid var(--border);flex-shrink:0}

.modal-in{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13.5px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none;box-sizing:border-box}

.modal-sel{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13.5px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none;appearance:none;cursor:pointer}
.modal-foot{padding:14px 22px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.modal-ok{flex:1;padding:9px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.modal-ok:hover{opacity:.9}
.modal-cancel{padding:9px 16px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.modal-cancel:hover{border-color:var(--text-2)}
.modal-chk-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.modal-chk-row{display:flex;align-items:center;gap:7px}
.modal-chk-in{flex:1;border:1px solid var(--border-2);border-radius:5px;padding:5px 8px;font-size:12.5px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none}
.modal-add-chk{font-size:12px;font-weight:600;color:var(--accent-text);background:transparent;border:none;padding:0;cursor:pointer;font-family:inherit;margin-top:4px}

/* ── Semáforo ────────────────────────────────────────────────────────────── */
.semaforo-wrap{display:flex;align-items:center;gap:7px}
.semaforo-lbl{font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-right:2px}
.sem-btn{width:14px;height:14px;border-radius:50%;opacity:.3;cursor:pointer;transition:all .15s;border:2px solid transparent}
.sem-btn.on{opacity:1;border-color:rgba(255,255,255,.5);transform:scale(1.15)}
.sem-btn:hover:not(.on){opacity:.65}
.sem-verde{background:#22C55E}
.sem-naranja{background:#F59E0B}
.sem-rojo{background:#EF4444}

/* ── Recordatorios section ───────────────────────────────────────────────── */
.rec-section{margin-bottom:20px}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rec-title{font-size:13px;font-weight:600;color:var(--text-1)}
.rec-new-btn{padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.rec-new-btn:hover{border-color:var(--accent);color:var(--accent-text)}
.rec-date{font-size:10.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-del-btn{background:transparent;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:0 2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.rec-row:hover .rec-del-btn{opacity:1}
.rec-in{flex:1;border:1px solid var(--border-2);border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none;min-width:0}
.rec-in:focus{border-color:var(--accent)}
.rec-ok-btn{padding:5px 12px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0}
.rec-cancel-btn{padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0}
.rec-section-hd{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
.rec-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:6px}
.rec-row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border-2);cursor:pointer;transition:background .1s}
.rec-row:last-child{border-bottom:none}
.rec-row:hover{background:var(--surface-2)}
.rec-row.done-row{opacity:.5}
.rec-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:transparent;transition:all .15s}
.rec-cb.on{background:var(--accent);border-color:var(--accent)}
.rec-body{flex:1;min-width:0}
.rec-text{font-size:13px;font-weight:500;color:var(--text-1);line-height:1.3}
.rec-row.done-row .rec-text{text-decoration:line-through;color:var(--text-3)}
.rec-detail{font-size:11px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-due{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.rec-del{background:transparent;border:none;color:var(--text-3);font-size:14px;cursor:pointer;padding:0 2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.rec-row:hover .rec-del{opacity:1}
.rec-add-row{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border-2);align-items:center;flex-wrap:wrap}
.rec-add-in{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none}
.rec-add-in:focus{border-color:var(--accent)}
.rec-add-ok{padding:6px 13px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
.rec-add-cancel{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:12px;font-family:inherit;cursor:pointer}
.rec-add-trigger{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-3);background:transparent;border:none;cursor:pointer;font-family:inherit;border-top:1px solid var(--border-2);width:100%;transition:color .15s}
.rec-add-trigger:hover{color:var(--accent-text)}

/* ── Rich task table ─────────────────────────────────────────────────────── */
.tk-section{margin-bottom:18px}
.tk-s-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.tk-s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tk-s-title{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-1)}
.tk-s-desc{font-size:11.5px;color:var(--text-3)}
.tk-s-badge{font-size:9.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:auto;white-space:nowrap}

.tk-table{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.tk-head-row{display:grid;grid-template-columns:80px 1fr 44px 120px 96px 114px 160px;align-items:center;padding:7px 14px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tk-th{font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}

/* priority stripe on the left */
.tk-task-wrap{border-bottom:1px solid var(--border-2)}
.tk-task-wrap:last-child{border-bottom:none}
.tk-task-wrap.alta{box-shadow:inset 3px 0 0 #EF4444}
.tk-task-wrap.media{box-shadow:inset 3px 0 0 #F59E0B}
.tk-task-wrap.baja{box-shadow:inset 3px 0 0 #22C55E}

.tk-task-row{
  display:grid;
  grid-template-columns:80px 1fr 44px 120px 96px 114px 160px;
  align-items:center;
  padding:10px 14px;
  cursor:pointer;
  transition:background .1s;
  gap:0;
  user-select:none;
}
.tk-task-row:hover{background:var(--surface-2)}
.tk-task-row.open{background:var(--accent-light)}

.tk-id{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--text-3);white-space:nowrap}
.tk-name-cell{min-width:0}
.tk-name-txt{font-size:13px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-name-txt.done{color:var(--text-3);text-decoration:line-through}
.tk-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s}
.tk-task-row:hover .tk-actions{opacity:1}
.tk-task-row.open .tk-actions{opacity:1}
.tk-act{background:transparent;border:none;font-size:12px;padding:2px;cursor:pointer;border-radius:4px;line-height:1}
.tk-act:hover{background:var(--border-2)}
.tk-act.del:hover{background:#FFE5E5}
.tk-due{font-size:11px;color:var(--text-3);white-space:nowrap}
.tk-sel{
  border:1px solid var(--border-2);border-radius:5px;
  padding:3px 6px;font-size:11px;font-family:inherit;
  background:var(--surface-2);color:var(--text-1);
  outline:none;cursor:pointer;appearance:none;
}
.tk-sel:focus{border-color:var(--accent)}
.tk-elems{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}
.tk-eb{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;background:var(--surface-2);color:var(--text-3);border:1px solid var(--border-2)}
.tk-eb.has{background:var(--accent-light);color:var(--accent-text);border-color:transparent}

/* Detail panel — hidden by default, grid when open */
.tk-detail{display:none;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;border-top:1px solid var(--border)}
.tk-detail.open{display:grid}

.tk-panel{padding:14px 16px;border-right:1px solid var(--border-2)}
.tk-panel:last-child{border-right:none}
.tk-panel-hd{font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}

.tk-textarea{
  width:100%;border:1px solid var(--border-2);border-radius:7px;
  padding:7px 9px;font-size:12px;font-family:'DM Sans',sans-serif;
  background:var(--surface-2);color:var(--text-1);
  resize:vertical;min-height:72px;outline:none;line-height:1.5
}
.tk-textarea:focus{border-color:var(--accent)}
.tk-in-sm{
  width:100%;border:1px solid var(--border-2);border-radius:5px;
  padding:5px 8px;font-size:11.5px;font-family:inherit;
  background:var(--surface-2);color:var(--text-1);outline:none
}
.tk-in-sm:focus{border-color:var(--accent)}
.tk-lbl-sm{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);margin-top:10px;margin-bottom:4px;display:block}
.tk-chk-items{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.tk-chk-row{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:12px;color:var(--text-1);border-radius:4px;transition:background .1s}
.tk-chk-row:hover{background:var(--surface-2)}
.tk-chk-row.done{color:var(--text-3);text-decoration:line-through}
.tk-chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:transparent}
.tk-chk-box.on{background:var(--accent);border-color:var(--accent)}
.tk-add-row{display:flex;gap:5px;align-items:center;margin-top:4px}
.tk-add-field{flex:1;border:1px solid var(--border-2);border-radius:5px;padding:5px 8px;font-size:11.5px;font-family:inherit;background:var(--surface-2);color:var(--text-1);outline:none}

.tk-add-plus:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.tk-link-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-2);font-size:12px}
.tk-link-item:last-of-type{border-bottom:none}
.tk-link-a{color:var(--accent-text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tk-del-sm{background:transparent;border:none;color:var(--text-3);font-size:12px;cursor:pointer;padding:0 2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.tk-link-item:hover .tk-del-sm{opacity:1}
.tk-empty-hint{font-size:11.5px;color:var(--text-3);padding:4px 0 8px;font-style:italic}
.tk-2in-row{display:grid;gap:4px;margin-top:8px}

/* ── App Overview: flujo + conexiones + conceptos ───────────────────────── */
.ov-section{margin-bottom:22px}
.ov-section-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ov-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* flow pipeline */
.ov-flow{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ov-step{flex:1;padding:16px 14px;position:relative;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.ov-step:hover{background:var(--surface-2)}
.ov-step:not(:last-child)::after{
  content:'→';
  position:absolute;right:-10px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--text-3);z-index:1;
  background:var(--surface);padding:2px 0;
  line-height:1
}
.ov-step:hover:not(:last-child)::after{background:var(--surface-2)}
.ov-step-ico{font-size:22px;margin-bottom:2px}
.ov-step-name{font-size:12px;font-weight:700;color:var(--text-1)}
.ov-step-desc{font-size:11px;color:var(--text-3);line-height:1.45}
.ov-step-link{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--accent-text);margin-top:4px;text-decoration:none}
.ov-step-link:hover{text-decoration:underline}
.ov-step-badge{display:inline-block;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.3px;margin-top:4px}
.ov-step-badge.ok{background:#EDFAF2;color:#0F9460}
.ov-step-badge.warn{background:#FFFBEC;color:#B07B00}
.ov-step-badge.off{background:#FFF0F0;color:#C53030}

/* connection cards */
.ov-conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ov-conn-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 15px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s}
.ov-conn-card:hover{border-color:var(--accent)}
.ov-conn-head{display:flex;align-items:center;gap:9px}
.ov-conn-ico{width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ov-conn-title{font-size:13px;font-weight:600;color:var(--text-1)}
.ov-conn-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.ov-conn-status{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600}
.ov-conn-status.ok{color:#0F9460}
.ov-conn-status.warn{color:#B07B00}
.ov-conn-status.off{color:#C53030}
.ov-conn-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-2);padding-top:7px}
.ov-conn-link{font-size:11px;font-weight:600;color:var(--accent-text);text-decoration:none;display:flex;align-items:center;gap:3px}
.ov-conn-link:hover{text-decoration:underline}

/* concepts glossary */
.ov-concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ov-concept{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 13px}
.ov-concept-term{font-size:11.5px;font-weight:700;color:var(--text-1);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ov-concept-def{font-size:11px;color:var(--text-3);line-height:1.5}
.ov-concept-tag{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:20px;background:var(--accent-light);color:var(--accent-text)}

// ── Accent palette by type ───────────────────────────────────────────────────
const ACCENT = {
  cliente:  {main:'#F04E23', light:'rgba(240,78,35,.09)',  text:'#D63A0F'},
  app:      {main:'#3D51E8', light:'rgba(61,81,232,.09)',  text:'#3045D0'},
  proveedor:{main:'#0F9460', light:'rgba(15,148,96,.09)',  text:'#0A7A4E'},
}

// Type visual config
const TYPE_SHAPE  = {cliente:'shape-cliente', app:'shape-app', proveedor:'shape-proveedor'}
const TYPE_BADGE  = {cliente:'🏢', app:'⚡', proveedor:'🗂️'}
const TYPE_ICON   = {cliente:'🏢', app:'⚡', proveedor:'🗂️'}

// ── State ────────────────────────────────────────────────────────────────────
let S = {
  navView: 'dashboard', // dashboard | proyectos | calendario | null (= project view)
  filter: 'todos',
  proj:   DATA[0],
  view:   'resumen',
  provCat: null,
  open:   {},
  addingCat: false,
  modal: null,  // null | 'newTask'
  _chkItems: ['',''],  // checklist items draft
  expandedTask: null,  // task code currently expanded in table
  addingRec: false,    // showing new recordatorio form
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function filtered(){
  if(S.filter==='todos')return DATA
  if(S.filter==='clientes')return DATA.filter(p=>p.type==='cliente')
  if(S.filter==='apps')return DATA.filter(p=>p.type==='app')
  if(S.filter==='proveedores')return DATA.filter(p=>p.type==='proveedor')
  return DATA
}
function defaultView(p){ return p.type==='cliente'?'resumen': p.type==='app'?'overview':'catalogo' }
function tabsFor(p){
  if(p.type==='cliente') return ['resumen','kanban','tabla','plantillas','meses']
  if(p.type==='app')     return ['overview','conexiones','docs','variables']
  return ['catalogo']
}
const TAB_LABELS = {resumen:'Resumen',kanban:'Kanban',tabla:'Tabla',plantillas:'Plantillas',meses:'Meses',
                    overview:'Overview',conexiones:'Conexiones',docs:'Docs',variables:'Variables',catalogo:'Catálogo'}

function applyAccent(type){
  const a = ACCENT[type]
  const r = document.documentElement
  r.style.setProperty('--accent',a.main)
  r.style.setProperty('--accent-light',a.light)
  r.style.setProperty('--accent-text',a.text)
}

// ── Event handlers ────────────────────────────────────────────────────────────
function setNavView(v){ S.navView=v; applyAccent('cliente'); render() }
function setFilter(f){ S.filter=f; const fl=filtered(); if(!fl.find(p=>p.id===S.proj?.id)) S.proj=fl[0]; render() }
function selectProj(id){ S.proj=DATA.find(p=>p.id===id); S.navView=null; S.view=defaultView(S.proj); S.provCat=null; S.open={}; S.addingCat=false; render() }
function setView(v){ S.view=v; render() }
function setProvCat(id){ S.provCat=id; S.open={}; render() }
function toggleCard(k){ S.open[k]=!S.open[k]; render() }

// ── Recordatorios ────────────────────────────────────────────────────────
function startAddRec(){ S.addingRec=true; render(); setTimeout(()=>document.getElementById('rec-txt-in')?.focus(),40) }
function cancelAddRec(){ S.addingRec=false; render() }
function confirmAddRec(pid){
  const txt=(document.getElementById('rec-txt-in')?.value||'').trim()
  if(!txt)return
  const detail=(document.getElementById('rec-det-in')?.value||'').trim()
  const due=(document.getElementById('rec-due-in')?.value||'')
  const p=DATA.find(x=>x.id===pid)
  if(p){if(!p.recordatorios)p.recordatorios=[];p.recordatorios.push({id:'r'+Date.now(),text:txt,detail,due,done:false})}
  S.addingRec=false;render()
}
function toggleRec(pid,idx){
  const p=DATA.find(x=>x.id===pid)
  if(p?.recordatorios?.[idx])p.recordatorios[idx].done=!p.recordatorios[idx].done
  render()
}
function deleteRec(pid,idx){
  const p=DATA.find(x=>x.id===pid)
  if(p?.recordatorios)p.recordatorios.splice(idx,1)
  render()
}
function setSemaforo(pid,col){
  const p=DATA.find(x=>x.id===pid)
  if(p)p.semaforo=col
  render()
}
// ── Task table interactions ────────────────────────────────────────────────
function toggleTaskRow(code){
  S.expandedTask=S.expandedTask===code?null:code
  render()
}
function updateTaskField(pid,code,field,val){
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t)t[field]=val
  render()
}
function toggleChkItem(pid,code,idx){
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t?.checklist?.[idx])t.checklist[idx].done=!t.checklist[idx].done
  render()
}
function addChkItem(pid,code){
  const el=document.getElementById('chk-in-'+code)
  const txt=(el?.value||'').trim()
  if(!txt)return
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t){if(!t.checklist)t.checklist=[];t.checklist.push({text:txt,done:false})}
  el.value='';render()
}
function addLinkItem(pid,code){
  const nEl=document.getElementById('lnk-n-'+code)
  const hEl=document.getElementById('lnk-h-'+code)
  const name=(nEl?.value||'').trim()
  const href=(hEl?.value||'').trim()
  if(!name&&!href)return
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t){if(!t.links)t.links=[];t.links.push({name:name||href,href:href||'#'})}
  nEl.value='';hEl.value='';render()
}
function deleteLinkItem(pid,code,idx){
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t?.links)t.links.splice(idx,1)
  render()
}
function addFileItem(pid,code){
  const nEl=document.getElementById('fil-n-'+code)
  const hEl=document.getElementById('fil-h-'+code)
  const name=(nEl?.value||'').trim()
  const href=(hEl?.value||'').trim()
  if(!name&&!href)return
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t){if(!t.files)t.files=[];t.files.push({name:name||'Archivo',href:href||'#'})}
  nEl.value='';hEl.value='';render()
}
function deleteFileItem(pid,code,idx){
  const p=DATA.find(x=>x.id===pid)
  const t=p?.tasks?.find(x=>x.code===code)
  if(t?.files)t.files.splice(idx,1)
  render()
}
function deleteTask(pid,code,e){
  e.stopPropagation()
  const p=DATA.find(x=>x.id===pid)
  if(p?.tasks)p.tasks=p.tasks.filter(t=>t.code!==code)
  if(S.expandedTask===code)S.expandedTask=null
  render()
}

// ── Nueva tarea modal ─────────────────────────────────────────────────────
function openNewTask(){ S.modal='newTask'; S._chkItems=['','']; render(); setTimeout(()=>document.getElementById('nt-name')?.focus(),50) }
function closeModal(){ S.modal=null; render() }
function addChkItem(){ S._chkItems.push(''); render(); setTimeout(()=>{const inputs=document.querySelectorAll('.modal-chk-in');inputs[inputs.length-1]?.focus()},30) }
function submitNewTask(){
  const name=(document.getElementById('nt-name')?.value||'').trim()
  if(!name)return
  const priority=document.getElementById('nt-priority')?.value||'Media'
  const owner=(document.getElementById('nt-owner')?.value||'').trim()||'—'
  const due=document.getElementById('nt-due')?.value||''
  const link=(document.getElementById('nt-link')?.value||'').trim()
  const attach=(document.getElementById('nt-attach')?.value||'').trim()
  const chkInputs=[...document.querySelectorAll('.modal-chk-in')].map(i=>i.value.trim()).filter(Boolean)
  const p=S.proj
  if(!p||p.type!=='cliente')return
  const nextCode=p.id.toUpperCase()+'-'+(String((p.tasks?.length||0)+1).padStart(3,'0'))
  const task={
    code:nextCode, name, owner, status:'En curso', priority, due,
    ...(chkInputs.length?{checklist:chkInputs.map(t=>({text:t,done:false}))}:{}),
    ...(link?{link:{label:link.replace(/https?:\/\//,'').split('/')[0],href:link}}:{}),
    ...(attach?{attachment:{name:attach,size:'—'}}:{})
  }
  if(!p.tasks)p.tasks=[]
  p.tasks.push(task)
  S.modal=null
  render()
}
function startAddCat(){ S.addingCat=true; render(); setTimeout(()=>document.getElementById('cat-input')?.focus(),50) }
function cancelAddCat(){ S.addingCat=false; render() }
function confirmAddCat(){
  const input=document.getElementById('cat-input')
  const name=(input?.value||'').trim()
  if(!name)return
  // pick a default emoji based on name
  const emojiMap={foto:'📷',impresi:'🖨️',diseño:'🎨',design:'🎨',dev:'💻',video:'🎬',audio:'🎙️',event:'🎪',transport:'🚚',legal:'⚖️',traducc:'🌐'}
  let ico='📁'
  const lc=name.toLowerCase()
  for(const [k,v] of Object.entries(emojiMap)){if(lc.includes(k)){ico=v;break}}
  const prov=DATA.find(p=>p.type==='proveedor')
  if(prov){
    const newId='cat_'+Date.now()
    prov.cats.push({id:newId,ico,name,n:0,provs:[]})
    S.provCat=newId
  }
  S.addingCat=false
  render()
}

// ── Persistence ──────────────────────────────────────────────────────────────
function save(){
  try{
    const mutable=DATA.map(p=>({
      id:p.id,
      semaforo:p.semaforo,
      recordatorios:p.recordatorios||[],
      tasks:p.tasks||[],
      ...(p.cats!==undefined?{cats:p.cats}:{})
    }))
    localStorage.setItem('ligrow_data',JSON.stringify(mutable))
    localStorage.setItem('ligrow_state',JSON.stringify({
      projId:S.proj?.id,
      view:S.view,
      filter:S.filter,
      navView:S.navView
    }))
  }catch(e){}
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  save()
  applyAccent(S.proj?.type||'cliente')
  document.getElementById('app').innerHTML = sidebar() + main()
  if(S.modal==='newTask'){
    // Append modal overlay after #app
    let ov=document.getElementById('modal-root')
    if(!ov){ov=document.createElement('div');ov.id='modal-root';document.body.appendChild(ov)}
    ov.innerHTML=newTaskModal()
  } else {
    const ov=document.getElementById('modal-root')
    if(ov)ov.innerHTML=''
  }
}

  const isOn   = S.proj?.id===p.id ? 'on' : ''
  return `<div class="pi ${isOn} ${semCls}" onclick="selectProj('${p.id}')">
    <div class="pi-av-wrap">
      <div class="pi-av ${shape}" style="${avStyle}">${p.type==='proveedor'?badge:p.initials}</div>

  if(!p) return `<div class="mn"><div class="ct"><p style="color:var(--text-3)">Selecciona un proyecto</p></div></div>`
  const tabs = tabsFor(p)
  if(!tabs.includes(S.view)) S.view = tabs[0]
  const typeName = {cliente:'Cliente',app:'App',proveedor:'Proveedor'}[p.type]
  const btnLabel = p.type==='proveedor'?'+ Proveedor':p.type==='app'?'Abrir app':'+ Nueva tarea'
  const btnClick = p.type==='cliente'?`openNewTask()`:`console.log('action')`
  const shape    = TYPE_SHAPE[p.type]
  const badge    = TYPE_BADGE[p.type]
  const lgStyle  = p.type==='proveedor'?`color:${p.color}`:`background:${p.color}`
  const lgInner  = p.type==='proveedor'?badge:p.initials
  return `<div class="mn">
    <div class="tb">
      <div class="tb-row1">
        <div class="proj-av-lg-wrap">
          <div class="proj-av-lg ${shape}" style="${lgStyle}">${lgInner}</div>
          <div class="proj-av-badge">${badge}</div>
        </div>
        <div class="proj-title-wrap">
          <div class="proj-title">${p.name}</div>
          <div class="proj-sub-text">${p.sub}</div>
        </div>
        <span class="type-pill">${typeName}</span>
        ${p.type==='cliente'?`
        <div class="semaforo-wrap">
          <span class="semaforo-lbl">SEMÁFORO</span>
          <div class="sem-btn sem-verde ${p.semaforo==='verde'?'on':''}" onclick="setSemaforo('${p.id}','verde')" title="Verde"></div>
          <div class="sem-btn sem-naranja ${p.semaforo==='naranja'?'on':''}" onclick="setSemaforo('${p.id}','naranja')" title="Naranja"></div>
          <div class="sem-btn sem-rojo ${p.semaforo==='rojo'?'on':''}" onclick="setSemaforo('${p.id}','rojo')" title="Rojo"></div>
        </div>`:''}
        <button class="tb-action" onclick="${btnClick}">${btnLabel}</button>
      </div>
      <div class="tabs">
        ${tabs.map(t=>`<button class="tab ${S.view===t?'on':''}" onclick="setView('${t}')">${TAB_LABELS[t]}</button>`).join('')}
      </div>
    </div>
    <div class="ct">${content(p)}</div>
  </div>`
}

// ─ Content router
function content(p){
  if(p.type==='cliente') return clienteContent(p)
  if(p.type==='app')     return appContent(p)
  return provContent(p)
}

// ─ CLIENTE ──────────────────────────────────────────────────────────────────
function clienteContent(p){
  if(S.view==='kanban')     return kanban(p)
  if(S.view==='tabla')      return tablaRich(p)
  if(S.view==='plantillas') return `<div class="card"><div class="card-head">Plantillas mensuales</div><div class="dashed-box">Las plantillas de tareas recurrentes aparecerán aquí.</div></div>`
  if(S.view==='meses')      return `<div class="card"><div class="card-head">Ciclos mensuales</div><div class="dashed-box">Generación y cierre de meses aquí.</div></div>`
  return resumen(p)
}

function resumen(p){
  // New resumen: stats bar + recordatorios + rich task table
  const t=p.tasks||[]
  const en=t.filter(x=>x.status==='En curso').length
  const det=t.filter(x=>x.status==='Detenido').length
  const ok=t.filter(x=>x.status==='Listo').length
  return recordatoriosSection(p) + taskTableView(p)
}

// ── Recordatorios section ──────────────────────────────────────────────────
function fmtDue(due){
  if(!due)return ''
  try{return new Date(due+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
  catch{return due}
}
function recordatoriosSection(p){
  const recs=p.recordatorios||[]
  const inner = `
    <div class="rec-head">
      <div class="rec-title">🔔 Recordatorios / Temas pendientes</div>
      <button class="rec-new-btn" onclick="startAddRec()">+ Nuevo</button>
    </div>
    ${!recs.length?`<div style="font-size:12px;color:var(--text-3);padding:0 14px 14px">Sin recordatorios. Añade temas pendientes o avisos importantes.</div>`:''}
    ${recs.map((r,i)=>`
      <div class="rec-row ${r.done?'done-row':''}">
        <div class="rec-cb ${r.done?'on':''}" onclick="toggleRec('${p.id}',${i})">${r.done?'✓':''}</div>
        <div class="rec-body">
          <div class="rec-text" onclick="toggleRec('${p.id}',${i})">${r.text}</div>
          ${r.detail?`<div class="rec-detail">${r.detail}</div>`:''}
        </div>
        ${r.due?`<div class="rec-date">${fmtDue(r.due)}</div>`:''}
        <button class="rec-del-btn" onclick="deleteRec('${p.id}',${i})">🗑</button>
      </div>
    `).join('')}
    ${S.addingRec?`
      <div class="rec-add-row">
        <input id="rec-txt-in" class="rec-in" placeholder="Tarea o recordatorio…" style="flex:2" onkeydown="if(event.key==='Enter')confirmAddRec('${p.id}')"/>
        <input id="rec-det-in" class="rec-in" placeholder="Detalle (opcional)…" style="flex:2"/>
        <input id="rec-due-in" type="date" class="rec-in" style="width:130px;flex:none"/>
        <button class="rec-ok-btn" onclick="confirmAddRec('${p.id}')">Añadir</button>
        <button class="rec-cancel-btn" onclick="cancelAddRec()">✕</button>
      </div>
    `:''}
  `
  return `<div class="rec-wrap">${inner}</div>`
}

// ── Rich task table view ───────────────────────────────────────────────────
function taskTableView(p){
  const t=p.tasks||[]
  const pending = t.filter(x=>x.status!=='Listo')
  const done    = t.filter(x=>x.status==='Listo')
  return `
    ${tkSection(p,'pending',pending,'POR COMPLETAR','Tareas activas y pendientes','#EF4444','#FFF0F0','#C53030')}
    ${tkSection(p,'done',done,'COMPLETADAS','Trabajo ya finalizado','#22C55E','#EDFAF2','#0F9460')}
  `
}

function tkSection(p,key,tasks,title,desc,dotColor,badgeBg,badgeColor){
  return `<div class="tk-section">
    <div class="tk-s-head">
      <div class="tk-s-dot" style="background:${dotColor}"></div>
      <div class="tk-s-info">

        <div class="tk-s-desc">${desc} · Arrastra el nombre para reordenar.</div>
      </div>
      <div class="tk-s-badge" style="background:${badgeBg};color:${badgeColor}">${tasks.length} tarea${tasks.length!==1?'s':''}</div>
    </div>
    <div class="tk-table">
      <div class="tk-head-row">
        <div class="tk-th" style="color:${badgeColor}">ID</div>
        <div class="tk-th" style="color:${badgeColor}">TAREA</div>
        <div class="tk-th"></div>
        <div class="tk-th" style="color:${badgeColor}">VENCIMIENTO</div>

}

function tkTaskRow(p,t){
  const isOpen=S.expandedTask===t.code

  const dueFormatted=t.due?new Date(t.due+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''
  const prioClass=(t.priority||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  return `<div class="tk-task-wrap ${prioClass}">
    <div class="tk-task-row ${isOpen?'open':''}" onclick="toggleTaskRow('${t.code}')">
      <div class="tk-id">${t.code}</div>
      <div class="tk-name-cell"><div class="tk-name-txt ${isDone?'done':''}">${t.name}</div></div>
      <div class="tk-actions" onclick="event.stopPropagation()">
        <button class="tk-act" title="Editar">✏️</button>
        <button class="tk-act del" title="Eliminar" onclick="deleteTask('${p.id}','${t.code}',event)">🗑</button>
      </div>
      <div class="tk-due">${dueFormatted}</div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel" onchange="updateTaskField('${p.id}','${t.code}','priority',this.value)">
          ${['Alta','Media','Baja'].map(v=>`<option ${t.priority===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div onclick="event.stopPropagation()">
        <select class="tk-sel" onchange="updateTaskField('${p.id}','${t.code}','status',this.value)">
          ${['Sin empezar','En curso','Detenido','Listo'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="tk-elems">
        <span class="tk-eb ${cl.length?'has':''}" title="Checklist ${clDone}/${cl.length}">☑ ${clDone}/${cl.length}</span>
        <span class="tk-eb ${lk.length?'has':''}" title="${lk.length} Enlace${lk.length!==1?'s':''}">🔗 ${lk.length}</span>
        <span class="tk-eb ${fi.length?'has':''}" title="${fi.length} Archivo${fi.length!==1?'s':''}">📎 ${fi.length}</span>
      </div>
    </div>
    <div class="tk-detail ${isOpen?'open':''}">
      <!-- DESCRIPCIÓN -->
      <div class="tk-panel" onclick="event.stopPropagation()">
        <div class="tk-panel-hd">DESCRIPCIÓN</div>
        <textarea class="tk-textarea" placeholder="Explica el objetivo y los detalles de esta tarea." onchange="updateTaskField('${p.id}','${t.code}','description',this.value)">${t.description||''}</textarea>
        <span class="tk-lbl-sm">FECHA DE VENCIMIENTO</span>
        <input type="date" class="tk-in-sm" value="${t.due||''}" onchange="updateTaskField('${p.id}','${t.code}','due',this.value)"/>
      </div>
      <!-- CHECKLIST -->
      <div class="tk-panel" onclick="event.stopPropagation()">
        <div class="tk-panel-hd">CHECKLIST</div>
        <div class="tk-chk-items">
          ${cl.map((c,i)=>`
            <div class="tk-chk-row ${c.done?'done':''}" onclick="toggleChkItem('${p.id}','${t.code}',${i})">
              <div class="tk-chk-box ${c.done?'on':''}">${c.done?'✓':''}</div>
              ${c.text}
            </div>
          `).join('')}
        </div>
        <div class="tk-add-row">
          <input id="chk-in-${t.code}" class="tk-add-field" placeholder="Añadir elemento…" onkeydown="if(event.key==='Enter')addChkItem('${p.id}','${t.code}')"/>
          <button class="tk-add-plus" onclick="addChkItem('${p.id}','${t.code}')">+</button>
        </div>
      </div>
      <!-- ARCHIVOS -->
      <div class="tk-panel" onclick="event.stopPropagation()">
        <div class="tk-panel-hd">ARCHIVOS</div>
        ${fi.length?fi.map((f,i)=>`
          <div class="tk-link-item">
            <span class="tk-link-a">📄 ${f.name}</span>
            <button class="tk-del-sm" onclick="deleteFileItem('${p.id}','${t.code}',${i})">🗑</button>
          </div>
        `).join(''):`<div class="tk-empty-hint">Sin archivos vinculados.</div>`}
        <div class="tk-2in-row" style="grid-template-columns:1fr 26px">
          <div style="display:flex;flex-direction:column;gap:4px">
            <input id="fil-n-${t.code}" class="tk-in-sm" placeholder="Nombre del archivo…"/>
            <div style="display:flex;gap:4px">
              <input id="fil-h-${t.code}" class="tk-in-sm" placeholder="https://…" style="flex:1"/>

          </div>
        </div>

    </div>

function kanban(p){
  const t=p.tasks||[]
  return `<div class="kanban">${['En curso','Detenido','Listo'].map(s=>{
    const col=t.filter(x=>x.status===s)
    const chipClass = s==='En curso'?'chip-orange':s==='Listo'?'chip-green':'chip-red'
    return `<div class="k-col">
      <div class="k-col-h">
        <span class="k-col-title">${s}</span>
        <span class="k-count">${col.length}</span>
      </div>
      ${col.map(x=>{
        const cl=x.checklist||[]
        const done=cl.filter(c=>c.done).length
        const hasExtras=cl.length||x.link||x.attachment
        return `<div class="kc ${x.priority.toLowerCase()}">
        <div class="kc-code">${x.code}</div>
        <div class="kc-name">${x.name}</div>
        ${cl.length?`<div class="kc-chklist">${cl.map(c=>`
          <div class="kc-chk-item ${c.done?'done':''}">
            <div class="kc-chk-box ${c.done?'done':''}">${c.done?'✓':''}</div>
            ${c.text}
          </div>`).join('')}</div>`:''}
        ${hasExtras?`<div class="kc-extras">
          ${cl.length?`<div class="kc-prog-wrap">
            <div class="kc-prog-bar"><div class="kc-prog-fill" style="width:${Math.round(done/cl.length*100)}%"></div></div>
            <span class="kc-prog-txt">${done}/${cl.length}</span>
          </div>`:''}
          ${x.link?`<span class="kc-link">🔗 ${x.link.label}</span>`:''}
          ${x.attachment?`<span class="kc-att">📎 ${x.attachment.name}</span>`:''}
        </div>`:''}
        <div class="kc-foot">
          <span class="kc-owner">${x.owner}</span>
          <span class="pri ${x.priority.toLowerCase()}">${x.priority}</span>
        </div>
      </div>`}).join('')||`<div class="k-empty">Sin tareas</div>`}
    </div>`
  }).join('')}</div>`
}

function tabla(p){
  const t=p.tasks||[]
  const chipOf=s=>s==='En curso'?'chip chip-orange':s==='Listo'?'chip chip-green':'chip chip-red'
  return `<table class="gtable">
    <thead><tr>
      <th>Código</th><th>Tarea</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Vence</th>
    </tr></thead>
    <tbody>${t.map(x=>`<tr>
      <td class="tc">${x.code}</td>
      <td style="font-weight:500">${x.name}</td>
      <td>${x.owner}</td>
      <td><span class="${chipOf(x.status)}">${x.status}</span></td>
      <td><span class="pri ${x.priority.toLowerCase()}">${x.priority}</span></td>
      <td style="color:var(--text-3);font-variant-numeric:tabular-nums">${x.due}</td>
    </tr>`).join('')}</tbody>
  </table>`
}

// ─ APP ──────────────────────────────────────────────────────────────────────
function appContent(p){
  if(S.view==='conexiones') return appConexiones(p)
  if(S.view==='docs')       return appDocs(p)
  if(S.view==='variables')  return appVars(p)
  return appOverview(p)
}

function appOverview(p){
  const statusBadge=s=>s==='ok'?'ok':s==='warn'?'warn':'off'
  const statusLabel=s=>s==='ok'?'● Conectado':s==='warn'?'▲ Pendiente':'✗ Sin conectar'

  // Build flow steps from stack + conns
  const FLOW=[
    {
      ico:'🤖', name:'Claude Code',
      desc:'Aquí se escribe y modifica el código. Claude propone cambios; tú los apruebas.',
      href:'https://claude.ai/code', linkLabel:'Abrir Claude',
      badge:'ok'
    },
    {
      ico:'🐙', name:'GitHub',
      desc:'Claude hace commit y push. GitHub guarda el historial completo de cambios y versiones.',
      href: p.repo ? `https://github.com/${p.repo}` : null,
      linkLabel:'Ver repositorio',
      badge: p.repo ? 'ok' : 'off'
    },
    {
      ico:'▲', name:'Vercel',
      desc:'Detecta cada push automáticamente y publica la app. Cada rama tiene su propio preview.',
      href: (p.conns||[]).find(c=>c.name==='Vercel')?.href || 'https://vercel.com',
      linkLabel:'Panel Vercel',
      badge: (p.conns||[]).find(c=>c.name==='Vercel')?.status || 'off'
    },
    {
      ico:'🟩', name:'Supabase',
      desc:'Base de datos PostgreSQL en la nube. Almacena y sirve todos los datos de la app.',
      href: (p.conns||[]).find(c=>c.name==='Supabase')?.href || 'https://supabase.com',
      linkLabel:'Panel Supabase',
      badge: (p.conns||[]).find(c=>c.name==='Supabase')?.status || 'off'
    },
  ]

  const CONCEPTS=[
    {ico:'📦',term:'Commit',tag:'git',def:'Guarda una foto del código en ese momento, con un mensaje descriptivo del cambio.'},
    {ico:'🚀',term:'Push',tag:'git',def:'Envía los commits locales a GitHub para que queden guardados en la nube.'},
    {ico:'🌿',term:'Branch',tag:'git',def:'Versión paralela del código. Se usa para trabajar en algo nuevo sin afectar la rama principal.'},
    {ico:'🔀',term:'Merge',tag:'git',def:'Fusiona una branch con otra (normalmente con main) para integrar los cambios.'},
    {ico:'🔁',term:'Pull Request',tag:'git',def:'Propuesta formal de merge. Permite revisar y discutir los cambios antes de integrarlos.'},
    {ico:'🌐',term:'Deploy',tag:'vercel',def:'Proceso de publicar la app. Vercel lo hace automáticamente con cada push a main.'},
    {ico:'🔍',term:'Preview',tag:'vercel',def:'URL temporal que Vercel crea para cada branch. Permite probar cambios antes de publicar.'},
    {ico:'🔑',term:'Env vars',tag:'config',def:'Variables secretas (contraseñas, API keys) que la app lee en producción. Nunca van al código.'},
  ]

  const tagColor={git:'#3045D0',vercel:'#232220',config:'#7C3AED'}
  const tagBg  ={git:'rgba(61,81,232,.1)',vercel:'rgba(35,34,32,.08)',config:'rgba(124,58,237,.1)'}

  return `
  <!-- Stack pill row -->
  ${(p.stack||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
    ${(p.stack||[]).map(s=>`<span class="stack-tag">${s}</span>`).join('')}
  </div>`:''}

  <!-- Flujo de trabajo -->
  <div class="ov-section">
    <div class="ov-section-title">Cómo funciona todo junto</div>
    <div class="ov-flow">
      ${FLOW.map(s=>`
        <div class="ov-step">
          <div class="ov-step-ico">${s.ico}</div>
          <div class="ov-step-name">${s.name}</div>
          <div class="ov-step-desc">${s.desc}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px">
            ${s.href?`<a class="ov-step-link" href="${s.href}" target="_blank" rel="noopener">${s.linkLabel} ↗</a>`:'<span></span>'}
            <span class="ov-step-badge ${statusBadge(s.badge)}">${statusLabel(s.badge)}</span>
          </div>
        </div>`).join('')}
    </div>
  </div>

  <!-- Conexiones -->
  ${(p.conns||[]).length?`<div class="ov-section">
    <div class="ov-section-title">Conexiones activas</div>
    <div class="ov-conns">
      ${(p.conns||[]).map(c=>`
        <div class="ov-conn-card">
          <div class="ov-conn-head">
            <div class="ov-conn-ico">${c.ico}</div>
            <div>
              <div class="ov-conn-title">${c.name}</div>
              <div class="ov-conn-sub">${c.detail}</div>
            </div>
          </div>
          <div class="ov-conn-foot">
            ${c.href?`<a class="ov-conn-link" href="${c.href}" target="_blank" rel="noopener">Abrir ↗</a>`:`<span></span>`}
            <span class="ov-conn-status ${statusBadge(c.status)}">${statusLabel(c.status)}</span>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}

  <!-- Conceptos clave -->
  <div class="ov-section">
    <div class="ov-section-title">Conceptos clave</div>
    <div class="ov-concepts">
      ${CONCEPTS.map(c=>`
        <div class="ov-concept">
          <div class="ov-concept-term">
            <span>${c.ico}</span> ${c.term}
            <span class="ov-concept-tag" style="background:${tagBg[c.tag]};color:${tagColor[c.tag]}">${c.tag}</span>
          </div>
          <div class="ov-concept-def">${c.def}</div>
        </div>`).join('')}
    </div>
  </div>`
}

function connStatus(s){
  if(s==='ok')   return `<span class="conn-s ok">✓ Conectado</span>`
  if(s==='warn') return `<span class="conn-s warn">⚠ Pendiente</span>`
  return `<span class="conn-s off">✗ Sin conectar</span>`
}

function appConexiones(p){
  return `<div class="card" style="max-width:640px">
    <div class="card-head">Conexiones &amp; Integraciones</div>
    <div class="conn-list">
      ${(p.conns||[]).map(c=>`
        <div class="conn-row">
          <div class="conn-ico" style="font-size:20px">${c.ico}</div>
          <div class="conn-body">
            <div class="conn-name">${c.name}</div>
            <div class="conn-detail">${c.detail}</div>
            ${c.href?`<a class="conn-link" href="${c.href}" target="_blank" rel="noopener">Abrir ↗</a>`:``}
          </div>
          ${connStatus(c.status)}

      `).join('')}

}

function appDocs(p){
  return `<div class="card" style="max-width:520px">
    <div class="card-head">Documentación &amp; Recursos</div>
    ${(p.docs||[]).map(d=>`
      <div class="doc-row">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="font-size:16px">📄</span>
          <span class="doc-name">${d.name}</span>
        </div>
        <span class="doc-link">Ver ↗</span>
      </div>
    `).join('')}
  </div>`
}

function appVars(p){
  return `<div class="card" style="max-width:560px">
    <div class="card-head">Variables de entorno · Producción</div>
    <div style="background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;overflow:hidden">
      <table class="env-table">
        <tbody>${(p.envs||[]).map(e=>`<tr>
          <td class="env-key">${e.key}</td>
          <td><span class="env-val">${e.val}</span></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="env-note">Configura estas variables en el panel de Vercel o Railway antes del despliegue. Nunca las comitees al repositorio.</p>
  </div>`
}

// ─ PROVEEDOR ────────────────────────────────────────────────────────────────
function provContent(p){
  const cats=p.cats||[]
  if(!S.provCat) S.provCat=cats[0]?.id
  const cat=cats.find(c=>c.id===S.provCat)||cats[0]
  return `<div class="prov-layout">
    <div class="prov-cats">
      <div class="cat-list-wrap">
        ${cats.map(c=>`
          <div class="cat-item ${c.id===S.provCat?'on':''}" onclick="setProvCat('${c.id}')">
            <span class="cat-ico">${c.ico}</span>
            <span class="cat-name">${c.name}</span>
            <span class="cat-n">${c.n}</span>
          </div>
        `).join('')}
        ${S.addingCat
          ? `<div class="cat-input-row">
               <input id="cat-input" class="cat-input" placeholder="Nombre categoría…"
                 onkeydown="if(event.key==='Enter')confirmAddCat();if(event.key==='Escape')cancelAddCat()"/>
               <button class="cat-input-ok" onclick="confirmAddCat()">OK</button>
             </div>`
          : `<button class="cat-add-btn" onclick="startAddCat()">
               <span style="font-size:15px;line-height:1">+</span> Nueva categoría
             </button>`
        }
      </div>
    </div>
    <div class="prov-content">
      <div class="prov-folder-bar">
        <span class="folder-ico">${cat?.ico||'📁'}</span>
        <div>
          <div class="folder-title">${cat?.name||''}</div>
          <div class="folder-sub">${cat?.provs?.length||0} proveedores</div>
        </div>
        <button class="add-btn">+ Añadir proveedor</button>
      </div>
      <div class="prov-cards">
        ${(cat?.provs||[]).map((pv,i)=>{
          const k=`${cat.id}_${i}`
          const isOpen=!!S.open[k]
          return `<div class="prov-card">
            <div class="prov-card-h ${isOpen?'open':''}" onclick="toggleCard('${k}')">
              <div>
                <div class="prov-card-name">${pv.name}</div>
                <div class="prov-card-type">${pv.type}</div>
              </div>
              <span class="chev ${isOpen?'open':''}">▼</span>
            </div>
            <div class="prov-card-body ${isOpen?'open':''}">
              ${(pv.fields||[]).map(f=>`
                <div class="pf-row">
                  <span class="pf-k">${f.k}</span>
                  <span class="pf-v">${f.v}</span>
                </div>
              `).join('')}
              ${pv.prices?.length?`
                <div class="price-head">Tarifas</div>
                <table class="ptable">
                  <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead>
                  <tbody>${pv.prices.map(r=>`<tr>
                    <td>${r.prod}</td>
                    <td style="color:var(--text-3)">${r.qty}</td>
                    <td class="price-val">${r.price}</td>
                  </tr>`).join('')}</tbody>
                </table>
              `:''}
            </div>
          </div>`
        }).join('')}
      </div>
    </div>
  </div>`
}

// ─ NAV: Dashboard ────────────────────────────────────────────────────────────
function navDashboard(){
  const clientes = DATA.filter(p=>p.type==='cliente')
  const allTasks = clientes.flatMap(p=>(p.tasks||[]).map(t=>({...t,clientName:p.name,clientColor:p.color})))
  const enCurso  = allTasks.filter(t=>t.status==='En curso')
  const detenido = allTasks.filter(t=>t.status==='Detenido')
  const listo    = allTasks.filter(t=>t.status==='Listo')
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Dashboard</div>
          <div class="proj-sub-text">Vista general · ${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
      </div>
    </div>
    <div class="ct">
      <div class="stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><div class="stat-lbl">Clientes activos</div><div class="stat-val">${clientes.length}</div></div>
        <div class="stat"><div class="stat-lbl">En curso</div><div class="stat-val accent">${enCurso.length}</div></div>
        <div class="stat"><div class="stat-lbl">Detenidas</div><div class="stat-val">${detenido.length}</div></div>
        <div class="stat"><div class="stat-lbl">Completadas</div><div class="stat-val green">${listo.length}</div></div>
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px">Tareas activas por cliente</div>
      ${clientes.map(p=>{
        const t=p.tasks||[]
        const en=t.filter(x=>x.status==='En curso')
        const det=t.filter(x=>x.status==='Detenido')
        if(!t.length)return''
        return `<div class="card" style="margin-bottom:12px;padding:14px 18px;cursor:pointer" onclick="selectProj('${p.id}')">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:26px;height:26px;border-radius:6px;background:${p.color};display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;color:#fff">${p.initials}</div>
            <div style="font-weight:700;font-size:14px;color:var(--text-1)">${p.name}</div>
            <span style="margin-left:auto;font-size:11px;color:var(--text-3)">${p.sub}</span>
            <span class="chip chip-orange" style="margin-left:8px">${en.length} en curso</span>
            ${det.length?`<span class="chip chip-red">${det.length} detenida${det.length>1?'s':''}</span>`:''}
          </div>
          ${en.slice(0,3).map(x=>`<div class="t-row">
            <div class="t-dot" style="background:${x.priority==='Alta'?'#D63A0F':x.priority==='Media'?'#D48000':'#0F9460'}"></div>
            <div class="t-name">${x.name}</div>
            <div class="t-owner">${x.owner}</div>
            <span style="font-size:11px;color:var(--text-3)">${x.due}</span>
          </div>`).join('')}
          ${en.length>3?`<div style="font-size:11px;color:var(--text-3);padding:6px 0">+${en.length-3} más...</div>`:''}
        </div>`
      }).join('')}
    </div>
  </div>`
}

// ─ NAV: Proyectos ─────────────────────────────────────────────────────────────
function navProyectos(){
  const typeLabel={cliente:'Cliente',app:'App',proveedor:'Proveedor'}
  const groups=[
    {label:'Clientes', items:DATA.filter(p=>p.type==='cliente')},
    {label:'Apps',     items:DATA.filter(p=>p.type==='app')},
    {label:'Proveedores', items:DATA.filter(p=>p.type==='proveedor')},
  ]
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Todos los proyectos</div>
          <div class="proj-sub-text">${DATA.length} proyectos · ${DATA.filter(p=>p.type==='cliente').length} clientes · ${DATA.filter(p=>p.type==='app').length} apps</div>
        </div>
        <button class="tb-action" style="background:var(--brand)">+ Nuevo proyecto</button>
      </div>
    </div>
    <div class="ct">
      ${groups.map(g=>`
        <div style="margin-bottom:24px">
          <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px">${g.label}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
            ${g.items.map(p=>{
              const a=ACCENT[p.type]
              const t=p.tasks||[]
              const en=t.filter(x=>x.status==='En curso').length
              return `<div class="card" style="padding:14px 16px;cursor:pointer;transition:box-shadow .15s" onclick="selectProj('${p.id}')">
                <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
                  <div style="width:32px;height:32px;border-radius:${p.type==='app'?'50%':'8px'};background:${p.color};display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">${p.initials}</div>
                  <div>
                    <div style="font-weight:700;font-size:13px;color:var(--text-1)">${p.name}</div>
                    <span style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:${a.light};color:${a.text}">${typeLabel[p.type]}</span>
                  </div>
                </div>
                <div style="font-size:11.5px;color:var(--text-3);line-height:1.4">${p.sub}</div>
                ${t.length?`<div style="margin-top:10px;font-size:11px;color:var(--text-3)"><span style="color:var(--brand);font-weight:700">${en}</span> en curso · ${t.length} total</div>`:''}
              </div>`
            }).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`
}

// ─ NAV: Calendario ────────────────────────────────────────────────────────────
function navCalendario(){
  const allTasks = DATA.filter(p=>p.type==='cliente')
    .flatMap(p=>(p.tasks||[]).filter(t=>t.due).map(t=>({...t,clientName:p.name,clientColor:p.color})))
    .sort((a,b)=>a.due.localeCompare(b.due))
  const byDate={}
  allTasks.forEach(t=>{if(!byDate[t.due])byDate[t.due]=[];byDate[t.due].push(t)})
  const formatDate=d=>{const[y,m,day]=d.split('-');const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return`${parseInt(day)} ${months[parseInt(m)-1]}`}
  return `<div class="mn">
    <div class="tb" style="padding-bottom:0">
      <div class="tb-row1">
        <div style="flex:1">
          <div class="proj-title" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:19px">Calendario</div>
          <div class="proj-sub-text">Tareas ordenadas por fecha de vencimiento</div>
        </div>
      </div>
    </div>
    <div class="ct">
      ${Object.entries(byDate).map(([date,tasks])=>`
        <div style="display:flex;gap:16px;margin-bottom:16px;align-items:flex-start">
          <div style="width:52px;text-align:center;flex-shrink:0;padding-top:2px">
            <div style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px;color:var(--text-1);line-height:1">${formatDate(date).split(' ')[0]}</div>
            <div style="font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3)">${formatDate(date).split(' ')[1]}</div>
          </div>
          <div style="flex:1;border-left:2px solid var(--border-2);padding-left:16px">
            ${tasks.map(t=>`<div class="card" style="padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px">
              <div style="width:8px;height:8px;border-radius:50%;background:${t.clientColor};flex-shrink:0"></div>
              <div style="flex:1">
                <div style="font-size:13px;font-weight:500;color:var(--text-1)">${t.name}</div>
                <div style="font-size:11px;color:var(--text-3);margin-top:1px">${t.clientName} · ${t.owner}</div>
              </div>
              <span class="pri ${t.priority.toLowerCase()}">${t.priority}</span>
              <span class="chip ${t.status==='En curso'?'chip-orange':t.status==='Listo'?'chip-green':'chip-red'}">${t.status}</span>
            </div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`
}

// ── Restore persisted state ───────────────────────────────────────────────────
const STORE_VERSION='v2'
if(localStorage.getItem('ligrow_ver')!==STORE_VERSION){
  localStorage.removeItem('ligrow_data')
  localStorage.removeItem('ligrow_state')
  localStorage.setItem('ligrow_ver',STORE_VERSION)
}
try{
  const saved=JSON.parse(localStorage.getItem('ligrow_data')||'[]')
  saved.forEach(s=>{
    const p=DATA.find(x=>x.id===s.id)
    if(!p)return
    if(s.semaforo!==undefined)p.semaforo=s.semaforo
    if(Array.isArray(s.recordatorios))p.recordatorios=s.recordatorios
    if(Array.isArray(s.tasks))p.tasks=s.tasks
    if(Array.isArray(s.cats))p.cats=s.cats
  })
  const st=JSON.parse(localStorage.getItem('ligrow_state')||'{}')
  if(st.filter&&['todos','clientes','apps','proveedores'].includes(st.filter))S.filter=st.filter
  if(st.projId){const found=DATA.find(x=>x.id===st.projId);if(found)S.proj=found}
  if(st.view)S.view=st.view
  if(st.navView!==undefined)S.navView=st.navView
}catch(e){}

// Start with brand orange
applyAccent('cliente')
render()
</script>
</body>
</html>
