    .fchip{flex:1;padding:5px 0;border-radius:6px;border:none;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:rgba(255,255,255,.35);transition:all .15s}

    .sidebar-nav{padding:16px 10px 8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.05)}
    .nav-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.45);transition:all .15s;margin-bottom:1px}
    .nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.7)}
    .nav-item.active{background:rgba(255,107,43,.1);color:#ff6b2b}
    .nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:#ff6b2b;color:#fff;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
    .nav-count{margin-left:auto;font-size:11px;color:rgba(255,255,255,.2)}
    .sidebar-projects{flex:1;overflow-y:auto;padding:8px 10px 16px}
    .section-label{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.2);padding:10px 8px 6px}

    .proj-info{flex:1;overflow:hidden}
    .proj-name{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .proj-sub{font-size:10.5px;color:rgba(255,255,255,.28);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .type-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:2px}

    /* ─── Main ────────────────────────────────────────────────── */
    .main{display:flex;flex-direction:column;background:#f4f4f5;overflow:hidden}

    .topbar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .proj-title-row{display:flex;align-items:center;gap:12px}
    .proj-icon-lg{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}

    .proj-title-info p{font-size:12px;color:#888;margin-top:1px}
    .type-badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
    .type-cliente{background:#fff0ea;color:#ff6b2b}
    .type-app{background:#eef0ff;color:#5b6ef5}
    .type-proveedor{background:#edfff5;color:#00a86b}
    .tabs{display:flex;gap:0}
    .tab{padding:8px 16px;border-radius:0;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:#999;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}

    .tab.active{color:#ff6b2b;border-bottom-color:#ff6b2b}

    .info-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e8e8ea}
    .info-card-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;margin-bottom:12px;display:flex;align-items:center;gap:6px}

    .s-detenido{background:#fff0f0;color:#e53e3e}

    .pri-media{background:#fff8ec;color:#d48000}

    .folder-title{font-size:16px;font-weight:800;color:#111}
    .folder-sub{font-size:12px;color:#aaa;margin-top:1px}

    .prov-card{background:#fff;border-radius:12px;border:1px solid #e8e8ea;overflow:hidden}

    .prov-card-name{font-size:14px;font-weight:700;color:#111}
    .prov-card-type{font-size:10px;font-weight:600;color:#bbb}
    .chevron{font-size:12px;color:#ccc;transition:transform .2s}
    .chevron.open{transform:rotate(180deg)}
    .prov-card-body{display:none;padding:14px 16px;border-top:1px solid #f5f5f5}
    .prov-card-body.open{display:block}
    .prov-field{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f9f9f9}

    .price-table td{padding:5px 6px;border-bottom:1px solid #f9f9f9;color:#333}
    .price-table tr:last-child td{border-bottom:none}
    .price-highlight{font-weight:700;color:#ff6b2b}

    .grid-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e8ea}
    .grid-table th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#bbb;border-bottom:1px solid #e8e8ea;background:#fafafa}
    .grid-table td{padding:11px 14px;border-bottom:1px solid #f3f3f3;color:#333}
    .grid-table tr:last-child td{border-bottom:none}
    .grid-table tr:hover td{background:#fafafa}

    /* ─── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:10px}

// ─── State ──────────────────────────────────────────────────────────────────
let state = {
  filter: 'todos',
  active: PROJECTS[0],
  view: 'resumen',
  provCat: null,  // categoria activa en proveedores
  openCards: {},  // qué proveedor cards están abiertas
}

// ─── Helpers ────────────────────────────────────────────────────────────────
function filtered() {
  if (state.filter === 'todos') return PROJECTS
  if (state.filter === 'clientes') return PROJECTS.filter(p => p.type === 'cliente')
  if (state.filter === 'apps') return PROJECTS.filter(p => p.type === 'app')
  if (state.filter === 'proveedores') return PROJECTS.filter(p => p.type === 'proveedor')
  return PROJECTS
}
function typeBadge(t) {
  if (t==='cliente') return '<span class="type-badge type-cliente">Cliente</span>'
  if (t==='app') return '<span class="type-badge type-app">App</span>'
  return '<span class="type-badge type-proveedor">Proveedor</span>'
}
function tabsFor(p) {
  if (p.type==='cliente') return ['resumen','kanban','tabla','plantillas','meses']
  if (p.type==='app') return ['overview','conexiones','docs','variables']
  return ['catalogo']
}
function labelTab(v) {
  return {resumen:'Resumen',kanban:'Kanban',tabla:'Tabla',plantillas:'Plantillas',meses:'Meses',
          overview:'Overview',conexiones:'Conexiones',docs:'Docs',variables:'Variables Entorno',
          catalogo:'Catálogo'}[v]||v
}
function statusIcon(s) {
  if (s==='ok')   return '<span class="conn-status conn-ok">✓ Conectado</span>'
  if (s==='warn') return '<span class="conn-status conn-warn">⚠ Pendiente</span>'
  return '<span class="conn-status conn-off">✗ Sin conectar</span>'
}

// ─── Render sidebar ─────────────────────────────────────────────────────────
function renderSidebar() {
  const filt = filtered()
  const clientes = filt.filter(p=>p.type==='cliente')
  const apps     = filt.filter(p=>p.type==='app')
  const provs    = filt.filter(p=>p.type==='proveedor')
  const total = PROJECTS.reduce((a,p)=> p.type==='cliente'? a+(p.tasks?.filter(t=>t.status==='En curso').length||0):a, 0)

  return `
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="logo">LIGROW</div>
      <div class="logo-sub">Task &amp; Project Hub</div>
      <div class="filter-row">
        ${['todos','clientes','apps','proveedores'].map(f=>`
          <button class="fchip ${state.filter===f?'active':''}" onclick="setFilter('${f}')">
            ${f.charAt(0).toUpperCase()+f.slice(1)}
          </button>
        `).join('')}
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-item active">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard <span class="nav-badge">${total}</span>
      </div>
      <div class="nav-item">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Proyectos <span class="nav-count">${PROJECTS.length}</span>
      </div>
      <div class="nav-item">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendario <span class="nav-count">3</span>
      </div>
    </div>
    <div class="sidebar-projects">
      ${clientes.length?`<div class="section-label">Clientes</div>${clientes.map(p=>projItem(p)).join('')}`:''}
      ${apps.length?`<div class="section-label">Apps</div>${apps.map(p=>projItem(p)).join('')}`:''}
      ${provs.length?`<div class="section-label">Proveedores</div>${provs.map(p=>projItem(p)).join('')}`:''}
    </div>
  </div>`
}
function projItem(p) {
  return `<div class="proj-item ${state.active?.id===p.id?'active':''}" onclick="selectProj('${p.id}')">
    <div class="proj-avatar" style="background:${p.color}">${p.initials}</div>
    <div class="proj-info">
      <div class="proj-name">${p.name}</div>
      <div class="proj-sub">${p.sub}</div>
    </div>
    <div class="type-dot" style="background:${p.type==='cliente'?'#ff6b2b':p.type==='app'?'#5b6ef5':'#2ecc71'}"></div>
  </div>`
}

// ─── Render main ────────────────────────────────────────────────────────────
function renderMain() {
  const p = state.active
  if (!p) return '<div class="main"><div class="content"><p style="color:#aaa">Selecciona un proyecto</p></div></div>'

  const tabs = tabsFor(p)
  if (!tabs.includes(state.view)) state.view = tabs[0]

  return `
  <div class="main">
    <div class="topbar">
      <div class="topbar-head">
        <div class="proj-title-row">
          <div class="proj-icon-lg" style="background:${p.color}">${p.initials}</div>
          <div class="proj-title-info">
            <h2>${p.name}</h2>
            <p>${p.sub}</p>
          </div>
          ${typeBadge(p.type)}
        </div>
        <button class="btn-primary">${p.type==='proveedor'?'+ Proveedor':p.type==='app'?'Abrir app':'+ Nueva tarea'}</button>
      </div>
      <div class="tabs">
        ${tabs.map(t=>`<button class="tab ${state.view===t?'active':''}" onclick="setView('${t}')">${labelTab(t)}</button>`).join('')}
      </div>
    </div>
    <div class="content">
      ${renderContent(p)}
    </div>
  </div>`
}

function renderContent(p) {
  if (p.type==='cliente') return renderCliente(p)
  if (p.type==='app') return renderApp(p)
  return renderProveedor(p)
}

// ─── CLIENTE views ──────────────────────────────────────────────────────────
function renderCliente(p) {
  if (state.view==='kanban')     return renderKanban(p)
  if (state.view==='tabla')      return renderTabla(p)
  if (state.view==='plantillas') return renderPlantillas(p)
  if (state.view==='meses')      return renderMeses(p)
  return renderResumen(p)
}
function renderResumen(p) {
  const t = p.tasks||[]
  const en = t.filter(x=>x.status==='En curso').length
  const det= t.filter(x=>x.status==='Detenido').length
  const ok = t.filter(x=>x.status==='Listo').length
  return `
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-val">${t.length}</div></div>
    <div class="stat-card"><div class="stat-label">Sin empezar</div><div class="stat-val">0</div></div>
    <div class="stat-card"><div class="stat-label">En edición</div><div class="stat-val orange">${en}</div></div>
    <div class="stat-card"><div class="stat-label">Detenido</div><div class="stat-val">${det}</div></div>
    <div class="stat-card"><div class="stat-label">Finalizadas</div><div class="stat-val" style="color:#00a86b">${ok}</div></div>
  </div>
  <div class="info-grid">
    <div class="info-card">
      <div class="info-card-title">📎 Documentos y recursos &nbsp;<span style="margin-left:auto;font-size:11px;color:#bbb">0 vinculados</span></div>
      <div class="empty-box">Los archivos y enlaces de las tareas aparecerán aquí.</div>
    </div>
    <div class="info-card">
      <div class="info-card-title">⏰ Recordatorios próximos</div>
      ${t.slice(0,3).map(x=>`
        <div class="task-row">
          <div class="task-dot" style="background:${x.priority==='Alta'?'#e53e3e':x.priority==='Media'?'#ff9f1c':'#00a86b'}"></div>
          <div class="task-row-name">${x.name}</div>
          <div class="task-row-owner">${x.owner}</div>
          <span class="status-chip ${x.status==='En curso'?'s-en-curso':x.status==='Listo'?'s-listo':'s-detenido'}">${x.status}</span>
        </div>
      `).join('')}
    </div>
  </div>`
}
function renderKanban(p) {
  const t = p.tasks||[]
  return `<div class="kanban-cols">${['En curso','Detenido','Listo'].map(s=>{
    const col=t.filter(x=>x.status===s)
    return `<div class="kanban-col">
      <div class="kanban-col-head"><h3>${s}</h3><span class="kanban-count">${col.length}</span></div>
      ${col.map(x=>`<div class="kcard ${x.priority.toLowerCase()}">
        <div class="kcard-code">${x.code}</div>
        <div class="kcard-name">${x.name}</div>
        <div class="kcard-foot"><span class="kcard-owner">${x.owner}</span><span class="pri-badge pri-${x.priority.toLowerCase()}">${x.priority}</span></div>
      </div>`).join('')||`<div style="color:#ccc;font-size:12px;padding:8px 0">Sin tareas</div>`}
    </div>`
  }).join('')}</div>`
}
function renderTabla(p) {
  const t = p.tasks||[]
  return `<table class="grid-table">
    <thead><tr><th>Código</th><th>Tarea</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Vence</th></tr></thead>
    <tbody>${t.map(x=>`<tr>
      <td style="color:#ccc;font-size:11px">${x.code}</td>
      <td style="font-weight:600">${x.name}</td>
      <td>${x.owner}</td>
      <td><span class="status-chip ${x.status==='En curso'?'s-en-curso':x.status==='Listo'?'s-listo':'s-detenido'}">${x.status}</span></td>
      <td><span class="pri-badge pri-${x.priority.toLowerCase()}">${x.priority}</span></td>
      <td style="color:#aaa">${x.due}</td>
    </tr>`).join('')}</tbody>
  </table>`
}
function renderPlantillas(p) {
  return `<div class="info-card"><div class="info-card-title">Plantillas mensuales</div>
    <div class="empty-box">Plantillas automáticas de tareas recurrentes</div></div>`
}
function renderMeses(p) {
  return `<div class="info-card"><div class="info-card-title">Ciclos mensuales</div>
    <div class="empty-box">Generación y cierre de meses</div></div>`
}

// ─── APP views ──────────────────────────────────────────────────────────────
function renderApp(p) {
  if (state.view==='conexiones') return renderConexiones(p)
  if (state.view==='docs')       return renderDocs(p)
  if (state.view==='variables')  return renderVars(p)
  return renderAppOverview(p)
}
function renderAppOverview(p) {
  return `
  <div class="app-grid">
    <div class="app-card">
      <div class="app-card-title">Stack tecnológico</div>
      <div class="app-stack">${(p.stack||[]).map(s=>`<span class="stack-tag">${s}</span>`).join('')}</div>
      <div style="height:16px"></div>
      <div class="app-card-title">Repositorio</div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fafafa;border:1px solid #eee;border-radius:8px">
        <span style="font-size:18px">🐙</span>
        <div>
          <div style="font-size:13px;font-weight:700;color:#222">${p.repo||'—'}</div>
          <a style="font-size:11px;color:#5b6ef5;font-weight:600;cursor:pointer">github.com/${p.repo}</a>
        </div>
      </div>
    </div>
    <div class="app-card">
      <div class="app-card-title">Estado de conexiones</div>
      <div class="conn-list" style="gap:6px">
        ${(p.connections||[]).map(c=>`
          <div class="conn-row">
            <div class="conn-icon" style="background:#f5f5f5">${c.icon}</div>
            <div class="conn-info">
              <div class="conn-name">${c.name}</div>
              <div class="conn-detail">${c.detail}</div>
            </div>
            ${statusIcon(c.status)}
          </div>
        `).join('')}
      </div>
    </div>
  </div>`
}
function renderConexiones(p) {
  return `<div class="app-card" style="max-width:700px">
    <div class="app-card-title">Conexiones &amp; Integraciones</div>
    <div class="conn-list">
      ${(p.connections||[]).map(c=>`
        <div class="conn-row">
          <div class="conn-icon" style="background:#f0f0f5;font-size:20px">${c.icon}</div>
          <div class="conn-info">
            <div class="conn-name">${c.name}</div>
            <div class="conn-detail">${c.detail}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${statusIcon(c.status)}
            ${c.link?`<a class="conn-link" href="${c.link}" target="_blank">Abrir ↗</a>`:''}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`
}
function renderDocs(p) {
  return `<div class="app-card" style="max-width:560px">
    <div class="app-card-title">Documentación &amp; Recursos</div>
    ${(p.docs||[]).map(d=>`
      <div class="app-doc-row">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">📄</span>
          <span class="app-doc-name">${d.name}</span>
        </div>
        <a class="app-doc-link">Ver ↗</a>
      </div>
    `).join('')}
  </div>`
}
function renderVars(p) {
  return `<div class="app-card" style="max-width:560px">
    <div class="app-card-title">Variables de entorno · Producción</div>
    <div style="background:#f9f9fb;border-radius:8px;padding:12px 14px;border:1px solid #eee">
      ${(p.envs||[]).map(e=>`
        <div class="app-env-row">
          <span class="app-env-key">${e.key}</span>
          <span class="app-env-val">${e.val}</span>
        </div>
      `).join('')}
    </div>
    <p style="font-size:11px;color:#bbb;margin-top:10px">Configura estas variables en el panel de Vercel o Railway antes del despliegue.</p>
  </div>`
}

// ─── PROVEEDOR views ────────────────────────────────────────────────────────
function renderProveedor(p) {
  const cats = p.categories||[]
  if (!state.provCat) state.provCat = cats[0]?.id
  const activeCat = cats.find(c=>c.id===state.provCat)||cats[0]

  return `<div class="prov-layout">
    <div class="prov-sidebar">
      <div class="cat-list">
        ${cats.map(c=>`
          <div class="cat-item ${c.id===state.provCat?'active':''}" onclick="setProvCat('${c.id}')">
            <span class="cat-icon">${c.icon}</span>
            <span class="cat-name">${c.name}</span>
            <span class="cat-count">${c.count}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="prov-main">
      <div class="prov-folder-head">
        <span class="folder-icon-big">${activeCat?.icon||'📁'}</span>
        <div>
          <div class="folder-title">${activeCat?.name||''}</div>
          <div class="folder-sub">${activeCat?.providers?.length||0} proveedores disponibles</div>
        </div>
        <button class="btn-primary" style="margin-left:auto">+ Añadir proveedor</button>
      </div>
      <div class="prov-cards">
        ${(activeCat?.providers||[]).map((prov,i)=>`
          <div class="prov-card">
            <div class="prov-card-head" onclick="toggleCard('${activeCat.id}_${i}')">
              <div>
                <div class="prov-card-name">${prov.name}</div>
                <div class="prov-card-type">${prov.type}</div>
              </div>
              <span class="chevron ${state.openCards[activeCat.id+'_'+i]?'open':''}">▼</span>
            </div>
            <div class="prov-card-body ${state.openCards[activeCat.id+'_'+i]?'open':''}">
              <div style="margin-bottom:12px">
                ${(prov.fields||[]).map(f=>`
                  <div class="prov-field">
                    <span class="prov-field-key">${f.k}</span>
                    <span class="prov-field-val">${f.v}</span>
                  </div>
                `).join('')}
              </div>
              ${prov.prices?.length?`
                <div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;margin-bottom:6px">Tarifas</div>
                <table class="price-table">
                  <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead>
                  <tbody>
                    ${prov.prices.map(r=>`<tr>
                      <td>${r.prod}</td>
                      <td style="color:#aaa">${r.qty}</td>
                      <td class="price-highlight">${r.price}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              `:''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`
}

// ─── Event handlers ─────────────────────────────────────────────────────────
function setFilter(f)    { state.filter=f; const filt=filtered(); if(!filt.find(p=>p.id===state.active?.id)) state.active=filt[0]; render() }
function selectProj(id)  { state.active=PROJECTS.find(p=>p.id===id); state.view=tabsFor(state.active)[0]; state.provCat=null; render() }
function setView(v)      { state.view=v; render() }
function setProvCat(id)  { state.provCat=id; state.openCards={}; render() }
function toggleCard(key) { state.openCards[key]=!state.openCards[key]; render() }

// ─── Main render ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = renderSidebar() + renderMain()
}
render()
</script>
